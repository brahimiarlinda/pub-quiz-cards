<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pub Quiz Cards – 1,400 questions with answers</title>
<meta name="description" content="1,400 pub quiz questions with answers and short explanations, as flip cards. Multiple choice, round builder, team scoreboard, timer, printable answer sheets, English and German.">
<meta name="theme-color" content="#1f5d47">
<link rel="manifest" href="manifest.webmanifest">
<!-- Visitor stats (cookie-free): https://abrahimi.goatcounter.com -->
<script data-goatcounter="https://abrahimi.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Pub Quiz Cards">
<meta property="og:description" content="1,400 pub quiz questions with answers, flip cards, multiple choice, a round builder and a host mode with scoreboard and timer.">
<meta property="og:url" content="https://brahimiarlinda.github.io/pub-quiz-cards/">
<meta property="og:image" content="https://brahimiarlinda.github.io/pub-quiz-cards/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://brahimiarlinda.github.io/pub-quiz-cards/og.png">
<style>
  :root{
    --bg:#f6f1e7; --panel:#fffdf8; --ink:#1f2a24; --muted:#6b7068; --line:#e3dccd;
    --accent:#1f5d47; --accent-ink:#fff; --back:#1f5d47; --back-ink:#f6f1e7;
    --easy:#2e7d4f; --medium:#b07a12; --hard:#b23a3a; --good:#2e7d4f; --bad:#b23a3a;
    --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141815;--panel:#1d221e;--ink:#ece8de;--muted:#9aa096;--line:#2e352f;
      --accent:#6fc39a;--accent-ink:#0f1411;--back:#24453a;--back-ink:#f1ece0;
      --easy:#6fc39a;--medium:#e0b14c;--hard:#ef7f7f;--good:#6fc39a;--bad:#ef7f7f;--shadow:0 1px 2px rgba(0,0,0,.4)}
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  a{color:inherit}
  header.app{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 18px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font:700 1.4rem/1.1 Georgia,"Times New Roman",serif;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .tab{border:none;background:none;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font:inherit;font-weight:600}
  .tab[aria-current=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .spacer{flex:1}
  .count{color:var(--muted);font-size:.88rem}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
  input[type=search],input[type=text],input[type=number],select{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:.95rem}
  input[type=search]{flex:1 1 220px;min-width:0}
  button,.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  button:hover,.chip:hover{border-color:var(--accent)}
  .chip[aria-pressed=true],.seg [aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn{border-radius:10px;padding:8px 12px}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.small{padding:5px 9px;font-size:.8rem}
  .chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin;padding-bottom:2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;border-radius:0;padding:7px 11px}
  .label{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .stats{font-size:.85rem;color:var(--muted)}
  .stats b.good{color:var(--good)} .stats b.bad{color:var(--bad)}
  .linkbtn{border:none;background:none;padding:0;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:.85rem}
  main .wrap{padding-top:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
  .card{perspective:1000px;height:250px;cursor:pointer;outline:none;position:relative}
  .inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .front{background:var(--panel);border:1px solid var(--line)}
  .back{background:var(--back);color:var(--back-ink);transform:rotateY(180deg)}
  .meta{display:flex;justify-content:space-between;gap:8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .back .meta{color:color-mix(in srgb,var(--back-ink) 70%,transparent)}
  .lvl{font-weight:700}
  .lvl.Easy{color:var(--easy)}.lvl.Medium{color:var(--medium)}.lvl.Hard{color:var(--hard)}
  .back .lvl{color:inherit}
  .mark{font-weight:700;margin-left:6px}
  .mark.got{color:var(--good)} .mark.missed{color:var(--bad)}
  .q{font:600 1.04rem/1.35 Georgia,serif;margin:auto 0;padding:8px 0}
  .bq{font-size:.78rem;opacity:.75;margin-top:6px;line-height:1.3}
  .a{font:700 1.12rem/1.3 Georgia,serif;margin:8px 0 4px}
  .s{font-size:.86rem;opacity:.92;overflow:auto;flex:1}
  .hint{font-size:.74rem;color:var(--muted);text-align:right}
  .actions{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .actions button{font-size:.78rem;padding:4px 9px;background:transparent;color:inherit;border-color:color-mix(in srgb,var(--back-ink) 40%,transparent)}
  .actions button[aria-pressed=true]{background:var(--back-ink);color:var(--back)}
  .actions a{font-size:.74rem;margin-left:auto;opacity:.8}
  .card:focus-visible .face,.mc:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  /* Multiple choice cards */
  .mc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
  .mc .q{margin:4px 0;padding:0}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;border-radius:10px;padding:7px 10px;white-space:normal;line-height:1.3;display:flex;gap:8px}
  .opt b{color:var(--muted)}
  .opt.right{background:color-mix(in srgb,var(--good) 18%,var(--panel));border-color:var(--good)}
  .opt.wrong{background:color-mix(in srgb,var(--bad) 15%,var(--panel));border-color:var(--bad)}
  .mc .s{font-size:.85rem;color:var(--muted);flex:none}
  .mc .actions{margin-top:0}
  .mc .actions a{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .more{display:block;margin:22px auto 40px}
  /* Round builder */
  .builder{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
  @media (max-width:820px){.builder{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .panel h2{font:700 1.15rem Georgia,serif;margin:0 0 10px}
  .field{margin:12px 0}
  .field>label,.field>.label{display:block;margin-bottom:5px}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;margin:8px 0}
  .roundsel{display:grid;gap:6px}
  .roundsel div{display:flex;align-items:center;gap:8px}
  .roundsel span{width:68px;font-size:.85rem;color:var(--muted)}
  .roundsel select{flex:1}
  .quiz h3{font:700 1.05rem Georgia,serif;margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
  .quiz h3 small{font:400 .8rem system-ui;color:var(--muted)}
  .quiz ol{margin:0;padding-left:24px}
  .quiz li{margin:4px 0}
  .quiz .ans{color:var(--accent);font-weight:600}
  .quiz.hide-ans .ans{display:none}
  .msg{color:var(--bad);font-size:.9rem;margin-top:8px}
  /* Host mode */
  #host{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
  #host.on{display:flex}
  #host .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  #host .pos{font-weight:700}
  #host .body{flex:1;display:flex;min-height:0}
  #host .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px;min-width:0}
  #host .card{height:min(56vh,440px);width:min(780px,100%)}
  #host .q{font-size:clamp(1.25rem,3.2vw,2rem)}
  #host .a{font-size:clamp(1.35rem,3.4vw,2.2rem)}
  #host .s{font-size:clamp(.95rem,1.7vw,1.12rem)}
  #host .bq{font-size:clamp(.85rem,1.5vw,1rem)}
  #host .hostopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  #host .hostopts div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:clamp(.9rem,1.7vw,1.1rem)}
  #host .back .hostopts div{border-color:color-mix(in srgb,var(--back-ink) 30%,transparent)}
  #host .back .hostopts div.right{background:var(--back-ink);color:var(--back);font-weight:700}
  .slide{width:min(780px,100%);text-align:center;padding:30px}
  .slide h2{font:700 clamp(2rem,6vw,3.4rem)/1.1 Georgia,serif;margin:0 0 8px}
  .slide p{color:var(--muted);font-size:1.15rem;margin:0}
  .board{width:min(560px,100%);margin:18px auto 0;display:grid;gap:8px;text-align:left}
  .board div{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:1.2rem}
  .board div:first-child{border-color:var(--accent);font-weight:700}
  #host .nav{display:flex;justify-content:center;gap:10px;padding:0 18px 18px;flex-wrap:wrap}
  .timer{display:inline-flex;align-items:center;gap:6px}
  .ring{width:46px;height:46px;position:relative;cursor:pointer}
  .ring svg{transform:rotate(-90deg)}
  .ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
  .ring.done span{color:var(--bad)}
  #teams{width:280px;border-left:1px solid var(--line);padding:14px;overflow:auto;display:none;background:var(--panel)}
  #teams.on{display:block}
  #teams h3{margin:0 0 10px;font:700 1rem Georgia,serif}
  .team{display:flex;align-items:center;gap:6px;margin:6px 0}
  .team .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team .sc{width:34px;text-align:center;font-weight:700}
  .team button{padding:3px 9px}
  @media (max-width:700px){#teams{position:absolute;right:0;top:0;bottom:0;z-index:3;width:min(300px,85vw);box-shadow:var(--shadow)}}

  /* Layout: sidebar + content */
  header.app .top{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
  .layout{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
  .side{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;padding-right:4px}
  .side section{margin-bottom:18px}
  .side h3{font:700 .72rem system-ui;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px 10px}
  .sidehead{display:none}
  .navlist{display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;border-radius:9px;padding:6px 10px;font-size:.9rem;color:var(--ink)}
  .navitem:hover{background:var(--panel)}
  .navitem[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
  .navitem .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .navitem[aria-pressed=true] .n{color:inherit;opacity:.8}
  .side .stats{margin:8px 10px 0;display:flex;flex-direction:column;gap:4px}
  .toolbar{position:sticky;top:57px;z-index:4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;background:var(--bg)}
  .toolbar input[type=search]{flex:1 1 240px}
  .summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 14px;font-size:.9rem;color:var(--muted)}
  .summary b{color:var(--ink)}
  #openSide{display:none}
  .pill{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:.8rem;color:var(--ink)}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr}
    .side{display:none;position:fixed;inset:0 auto 0 0;top:0;width:min(320px,88vw);max-height:none;z-index:30;background:var(--bg);padding:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
    .side.open{display:block}
    .sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    #openSide{display:inline-block}
    .toolbar{top:0}
  }
  /* Builder */
  fieldset{border:none;border-top:1px solid var(--line);margin:0;padding:12px 0 6px}
  legend{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;padding:0 6px 0 0}
  .step{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);align-items:center;justify-content:center;font-size:.78rem}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .pair label{display:flex;flex-direction:column;gap:4px}
  .pair input,.pair select{width:100%}
  .btn.wide{width:100%;padding:11px;margin-top:8px;font-size:.95rem}
  .quizbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
  .quizbar .group{display:inline-flex;align-items:center;gap:6px}
  /* Host bar */
  .hostctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 6px}
  .hostctl .btn{border:none;padding:6px 10px}
  .hostctl .btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
  .hostctl select{border:none;padding:4px 6px}
  /* Print */
  #printArea{display:none}
  @media print{
    body.printing > *:not(#printArea){display:none !important}
    body.printing #printArea{display:block;color:#000;background:#fff;font:12pt/1.4 Georgia,serif}
    #printArea h1{font-size:20pt;margin:0 0 4pt}
    #printArea h2{font-size:14pt;margin:14pt 0 6pt;border-bottom:1px solid #000;padding-bottom:2pt}
    #printArea .team-line{margin:8pt 0 4pt;font-size:12pt}
    #printArea section{break-inside:avoid;page-break-inside:avoid}
    #printArea section.newpage{break-before:page;page-break-before:always}
    #printArea ol{margin:0;padding-left:22pt}
    #printArea li{margin:0 0 9pt}
    #printArea .blank{border-bottom:1px solid #999;height:16pt}
    #printArea .ch{font-size:10.5pt;color:#333}
    #printArea .key{font-weight:700}
    #printArea .sm{font-size:10pt;color:#444}
  }
  @media (max-width:560px){.card{height:240px}h1{font-size:1rem}.tabs{margin-left:0;gap:0}.tab{padding:6px 7px;font-size:.9rem}header.app .top{gap:6px}}
  
</style>
</head>
<body>
<header class="app">
  <div class="wrap top">
    <h1>Pub Quiz <span>Cards</span></h1>
    <nav class="tabs" aria-label="Views">
      <button class="tab" id="tabCards" data-i18n="cards"></button>
      <button class="tab" id="tabRounds" data-i18n="rounds"></button>
    </nav>
    <span class="spacer"></span>
    <button class="btn small" id="langBtn" aria-label="Language"></button>
  </div>
</header>

<main>
  <div class="wrap layout" id="cardsView">
    <aside class="side" id="side" aria-label="Filters">
      <div class="sidehead"><strong data-i18n="filters"></strong><button class="linkbtn" id="closeSide" data-i18n="done"></button></div>
      <section><h3 data-i18n="category"></h3><div class="navlist" id="cats"></div></section>
      <section><h3 data-i18n="difficulty"></h3><div class="navlist" id="lvls"></div></section>
      <section><h3 data-i18n="progress"></h3><div class="navlist" id="statusChips"></div><div class="stats" id="stats"></div></section>
    </aside>
    <div class="content">
      <div class="toolbar" id="cardControls">
        <input type="search" id="search" aria-label="Search">
        <div class="seg" role="group" aria-label="Mode">
          <button id="modeFlip" data-i18n="flip"></button><button id="modeMC" data-i18n="mc"></button>
        </div>
        <button class="btn primary" id="hostBtn" data-i18n="host"></button>
      </div>
      <div class="summary">
        <button class="btn small" id="openSide" data-i18n="filters"></button>
        <span id="count"></span>
        <button class="linkbtn" id="clearFilters" data-i18n="clear"></button>
        <span class="spacer"></span>
        <button class="btn small" id="shuffle" data-i18n="shuffle"></button>
        <button class="btn small" id="flipAll"></button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
      <button class="btn more" id="more" hidden></button>
    </div>
  </div>
  <div class="wrap" id="roundsView" hidden>
    <div class="builder">
      <form class="panel" id="builderForm">
        <h2 data-i18n="buildTitle"></h2>
        <fieldset><legend><span class="step">1</span><span data-i18n="stepSize"></span></legend>
          <div class="pair">
            <label><span class="label" data-i18n="numRounds"></span><input type="number" id="nRounds" min="1" max="10" value="5"></label>
            <label><span class="label" data-i18n="perRound"></span><select id="perRound"><option>5</option><option>8</option><option selected>10</option><option>12</option><option>15</option><option>20</option></select></label>
          </div></fieldset>
        <fieldset><legend><span class="step">2</span><span data-i18n="difficulty"></span></legend>
          <div class="row" id="diffChips" style="margin:0"></div></fieldset>
        <fieldset><legend><span class="step">3</span><span data-i18n="roundCats"></span></legend>
          <div class="roundsel" id="roundSel"></div></fieldset>
        <fieldset><legend><span class="step">4</span><span data-i18n="options"></span></legend>
          <label class="check"><input type="checkbox" id="avoidUsed" checked> <span data-i18n="avoidUsed"></span></label>
          <div class="stats" id="usedInfo" style="margin-left:26px"></div>
          <label class="check"><input type="checkbox" id="printChoices"> <span data-i18n="printChoices"></span></label></fieldset>
        <button class="btn primary wide" type="submit" data-i18n="generate"></button>
        <div class="msg" id="buildMsg"></div>
      </form>
      <div class="panel" id="quizPanel">
        <h2 data-i18n="yourQuiz"></h2>
        <div id="quizEmpty" class="stats" data-i18n="noQuiz"></div>
        <div id="quizBody" hidden>
          <div class="quizbar">
            <button class="btn primary" id="hostQuiz" data-i18n="hostQuiz"></button>
            <span class="group"><span class="label" data-i18n="print"></span>
              <button class="btn small" id="printSheets" data-i18n="printSheets"></button>
              <button class="btn small" id="printKey" data-i18n="printKey"></button></span>
            <span class="spacer"></span>
            <button class="linkbtn" id="toggleAns"></button>
          </div>
          <div class="quiz hide-ans" id="quizList"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="host" role="dialog" aria-label="Host mode">
  <div class="bar">
    <button class="btn" id="hostClose"></button>
    <span class="pos" id="hostPos"></span>
    <span class="spacer"></span>
    <div class="hostctl"><span class="timer"><label class="label" for="timerSel" data-i18n="timer"></label>
      <select id="timerSel"><option value="0"></option><option value="15">15 s</option><option value="30">30 s</option><option value="60">60 s</option></select>
      <span class="ring" id="ring" hidden title=""><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="ringArc" cx="23" cy="23" r="20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg><span id="ringNum"></span></span>
    </span>
    <button class="btn" id="choicesBtn" aria-pressed="false" data-i18n="showChoices"></button>
    <button class="btn" id="teamsBtn" data-i18n="teams"></button>
    <button class="btn" id="fsBtn" data-i18n="fullscreen"></button></div>
  </div>
  <div class="body" style="position:relative">
    <div class="stage" id="stage"></div>
    <aside id="teams">

<script>
const PACK = {"cats":[{"en":"General knowledge","de":"Allgemeinwissen","slug":"general"},{"en":"Geography","de":"Geografie","slug":"geography"},{"en":"History","de":"Geschichte","slug":"history"},{"en":"Science & nature","de":"Wissenschaft & Natur","slug":"science"},{"en":"Film & TV","de":"Film & TV","slug":"film-tv"},{"en":"Music","de":"Musik","slug":"music"},{"en":"Sport","de":"Sport","slug":"sport"},{"en":"Food & drink","de":"Essen & Trinken","slug":"food"},{"en":"Books, language & art","de":"Bücher, Sprache & Kunst","slug":"books-art"},{"en":"Germany & Europe","de":"Deutschland & Europa","slug":"germany-europe"},{"en":"Politics","de":"Politik","slug":"politics"},{"en":"90s","de":"90er","slug":"90s"},{"en":"Kids","de":"Kinder","slug":"kids"},{"en":"Albania","de":"Albanien","slug":"albania"}],"items":[{"id":"general-1","c":"General knowledge","l":"Easy","q":"How many days are in a leap year?","a":"366","s":"An extra day, 29 February, is added about every four years to keep the calendar in step with Earth's orbit.","o":["365","364","367"],"de":{"q":"Wie viele Tage hat ein Schaltjahr?","a":"366","s":"Etwa alle vier Jahre wird der 29. Februar eingefügt, damit der Kalender mit der Erdumlaufbahn Schritt hält.","o":["365","364","367"]}},{"id":"general-2","c":"General knowledge","l":"Easy","q":"How many sides does a hexagon have?","a":"6","s":"\"Hex\" is Greek for six; honeycomb cells are a famous natural example.","o":["5","7","8"],"de":{"q":"Wie viele Seiten hat ein Sechseck?","a":"6","s":"„Hex“ ist griechisch für sechs; Bienenwaben sind ein bekanntes Beispiel aus der Natur.","o":["5","7","8"]}},{"id":"general-3","c":"General knowledge","l":"Easy","q":"What colour do you get by mixing blue and yellow?","a":"Green","s":"Blue and yellow are primary colours in paint; mixed, they make the secondary colour green.","o":["Orange","Purple","Brown"],"de":{"q":"Welche Farbe entsteht, wenn man Blau und Gelb mischt?","a":"Grün","s":"Blau und Gelb sind Grundfarben beim Malen; gemischt ergeben sie die Sekundärfarbe Grün.","o":["Orange","Lila","Braun"]}},{"id":"general-4","c":"General knowledge","l":"Medium","q":"How many minutes are in one day?","a":"1,440","s":"24 hours × 60 minutes = 1,440.","o":["1,200","1,640","2,400"],"de":{"q":"Wie viele Minuten hat ein Tag?","a":"1.440","s":"24 Stunden × 60 Minuten = 1.440.","o":["1.200","1.640","2.400"]}},{"id":"general-5","c":"General knowledge","l":"Easy","q":"At what temperature in Celsius does water freeze?","a":"0 °C","s":"The Celsius scale was built around water: 0 °C to freeze, 100 °C to boil at sea level.","o":["32 °C","−10 °C","4 °C"],"de":{"q":"Bei welcher Temperatur in Celsius gefriert Wasser?","a":"0 °C","s":"Die Celsius-Skala wurde nach Wasser ausgerichtet: 0 °C gefrieren, 100 °C sieden auf Meereshöhe.","o":["32 °C","−10 °C","4 °C"]}},{"id":"general-6","c":"General knowledge","l":"Easy","q":"Which month has the fewest days?","a":"February","s":"It has 28 days, or 29 in a leap year.","o":["April","June","November"],"de":{"q":"Welcher Monat hat die wenigsten Tage?","a":"Februar","s":"Er hat 28 Tage, im Schaltjahr 29.","o":["April","Juni","November"]}},{"id":"general-7","c":"General knowledge","l":"Easy","q":"How many continents are there?","a":"7","s":"Africa, Antarctica, Asia, Australia/Oceania, Europe, North America and South America.","o":["5","6","8"],"de":{"q":"Wie viele Kontinente gibt es?","a":"7","s":"Afrika, Antarktis, Asien, Australien/Ozeanien, Europa, Nordamerika und Südamerika.","o":["5","6","8"]}},{"id":"general-8","c":"General knowledge","l":"Easy","q":"What is the largest ocean on Earth?","a":"The Pacific","s":"It covers about a third of the planet's surface, more than all the land combined.","o":["The Atlantic","The Indian Ocean","The Arctic Ocean"],"de":{"q":"Was ist der größte Ozean der Erde?","a":"Der Pazifik","s":"Er bedeckt etwa ein Drittel der Erdoberfläche – mehr als alle Landflächen zusammen.","o":["Der Atlantik","Der Indische Ozean","Das Nordpolarmeer"]}},{"id":"general-9","c":"General knowledge","l":"Easy","q":"How many legs does a spider have?","a":"8","s":"Spiders are arachnids, not insects, which have six legs.","o":["6","10","12"],"de":{"q":"Wie viele Beine hat eine Spinne?","a":"8","s":"Spinnen sind Spinnentiere, keine Insekten – Insekten haben sechs Beine.","o":["6","10","12"]}},{"id":"general-10","c":"General knowledge","l":"Easy","q":"What is the tallest animal in the world?","a":"The giraffe","s":"Adult males can reach about 5.5 metres tall.","o":["The elephant","The camel","The ostrich"],"de":{"q":"Welches ist das größte Tier der Welt (nach Körperhöhe)?","a":"Die Giraffe","s":"Ausgewachsene Bullen werden bis zu etwa 5,5 Meter hoch.","o":["Der Elefant","Das Kamel","Der Strauß"]}},{"id":"general-11","c":"General knowledge","l":"Easy","q":"What is the largest mammal in the world?","a":"The blue whale","s":"It is the largest animal known to have ever lived, at up to about 30 metres long.","o":["The African elephant","The sperm whale","The whale shark"],"de":{"q":"Was ist das größte Säugetier der Welt?","a":"Der Blauwal","s":"Das größte bekannte Tier, das je gelebt hat – bis zu etwa 30 Meter lang.","o":["Der Afrikanische Elefant","Der Pottwal","Der Walhai"]}},{"id":"general-12","c":"General knowledge","l":"Easy","q":"How many strings does a standard guitar have?","a":"6","s":"Standard tuning from low to high is E-A-D-G-B-E.","o":["4","5","7"],"de":{"q":"Wie viele Saiten hat eine normale Gitarre?","a":"6","s":"Die Standardstimmung von tief nach hoch: E-A-D-G-H-E.","o":["4","5","7"]}},{"id":"general-13","c":"General knowledge","l":"Medium","q":"What is the Roman numeral for 50?","a":"L","s":"The main Roman numerals are I, V, X, L, C, D and M (1, 5, 10, 50, 100, 500, 1,000).","o":["C","D","V"],"de":{"q":"Was ist die römische Zahl für 50?","a":"L","s":"Die wichtigsten römischen Zahlen sind I, V, X, L, C, D und M (1, 5, 10, 50, 100, 500, 1.000).","o":["C","D","V"]}},{"id":"general-14","c":"General knowledge","l":"Easy","q":"What is the Roman numeral for 1,000?","a":"M","s":"From the Latin \"mille\", meaning thousand.","o":["D","C","K"],"de":{"q":"Was ist die römische Zahl für 1.000?","a":"M","s":"Vom lateinischen „mille“ für tausend.","o":["D","C","K"]}},{"id":"general-15","c":"General knowledge","l":"Easy","q":"What do you call a shape with eight sides?","a":"An octagon","s":"\"Octo\" means eight, as in octopus; stop signs are octagons.","o":["A hexagon","A pentagon","A decagon"],"de":{"q":"Wie nennt man eine Form mit acht Seiten?","a":"Ein Achteck (Oktagon)","s":"„Okto“ heißt acht, wie bei Oktopus; Stoppschilder sind achteckig.","o":["Ein Sechseck","Ein Fünfeck","Ein Zehneck"]}},{"id":"general-16","c":"General knowledge","l":"Easy","q":"Which bird is a symbol of peace?","a":"The dove","s":"A white dove, often carrying an olive branch, has symbolised peace since ancient times.","o":["The swan","The eagle","The owl"],"de":{"q":"Welcher Vogel ist ein Symbol des Friedens?","a":"Die Taube","s":"Eine weiße Taube, oft mit Ölzweig, steht seit der Antike für Frieden.","o":["Der Schwan","Der Adler","Die Eule"]}},{"id":"general-17","c":"General knowledge","l":"Easy","q":"In which city is the Statue of Liberty?","a":"New York","s":"It stands on Liberty Island in New York Harbor and was dedicated in 1886.","o":["Washington, D.C.","Boston","Philadelphia"],"de":{"q":"In welcher Stadt steht die Freiheitsstatue?","a":"New York","s":"Sie steht auf Liberty Island im Hafen von New York und wurde 1886 eingeweiht.","o":["Washington, D.C.","Boston","Philadelphia"]}},{"id":"general-18","c":"General knowledge","l":"Easy","q":"What is the currency of Japan?","a":"The yen","s":"The yen has been Japan's currency since 1871.","o":["The won","The yuan","The baht"],"de":{"q":"Was ist die Währung Japans?","a":"Der Yen","s":"Der Yen ist seit 1871 Japans Währung.","o":["Der Won","Der Yuan","Der Baht"]}},{"id":"general-19","c":"General knowledge","l":"Medium","q":"How many pieces does each player have at the start of a chess game?","a":"16","s":"Eight pawns, two rooks, two knights, two bishops, one queen and one king.","o":["12","14","20"],"de":{"q":"Mit wie vielen Figuren beginnt jeder Spieler eine Schachpartie?","a":"16","s":"Acht Bauern, zwei Türme, zwei Springer, zwei Läufer, eine Dame und ein König.","o":["12","14","20"]}},{"id":"general-20","c":"General knowledge","l":"Hard","q":"Which is the only letter that doesn't appear in any US state name?","a":"Q","s":"Check all 50 names: Q never shows up.","o":["J","X","Z"],"de":{"q":"Welcher Buchstabe kommt in keinem Namen eines US-Bundesstaats vor?","a":"Q","s":"Man kann alle 50 Namen prüfen: Ein Q taucht nie auf.","o":["J","X","Z"]}},{"id":"general-21","c":"General knowledge","l":"Easy","q":"How many zeros are in one million?","a":"6","s":"1,000,000 = 10 to the power of 6.","o":["5","7","9"],"de":{"q":"Wie viele Nullen hat eine Million?","a":"6","s":"1.000.000 = 10 hoch 6.","o":["5","7","9"]}},{"id":"general-22","c":"General knowledge","l":"Easy","q":"What is a group of lions called?","a":"A pride","s":"A pride is usually a few related females, their cubs and one or more males.","o":["A pack","A herd","A troop"],"de":{"q":"Wie nennt man eine Gruppe von Löwen auf Englisch?","a":"Pride (Rudel)","s":"Ein Rudel besteht meist aus einigen verwandten Weibchen, ihren Jungen und einem oder mehreren Männchen.","o":["Pack","Herd","Troop"]}},{"id":"general-23","c":"General knowledge","l":"Medium","q":"What is a group of crows called?","a":"A murder","s":"The name probably comes from old folk tales linking crows with death.","o":["A flock","A parliament","A colony"],"de":{"q":"Wie nennt man eine Gruppe von Krähen auf Englisch?","a":"Murder","s":"Der Name stammt wohl aus alten Volksmärchen, die Krähen mit dem Tod verbanden.","o":["Flock","Parliament","Colony"]}},{"id":"general-24","c":"General knowledge","l":"Easy","q":"What is a baby kangaroo called?","a":"A joey","s":"Joeys are born tiny and grow inside their mother's pouch.","o":["A cub","A kit","A calf"],"de":{"q":"Wie heißt ein Kängurujunges auf Englisch?","a":"Joey","s":"Joeys kommen winzig zur Welt und wachsen im Beutel der Mutter heran.","o":["Cub","Kit","Calf"]}},{"id":"general-25","c":"General knowledge","l":"Easy","q":"Which planet is closest to the Sun?","a":"Mercury","s":"It is also the smallest planet and goes around the Sun in just 88 days.","o":["Venus","Mars","Earth"],"de":{"q":"Welcher Planet ist der Sonne am nächsten?","a":"Merkur","s":"Er ist auch der kleinste Planet und umrundet die Sonne in nur 88 Tagen.","o":["Venus","Mars","Erde"]}},{"id":"general-26","c":"General knowledge","l":"Medium","q":"Which language has the most native speakers in the world?","a":"Mandarin Chinese","s":"Over 900 million native speakers; English has the most speakers once learners are counted.","o":["English","Spanish","Hindi"],"de":{"q":"Welche Sprache hat die meisten Muttersprachler der Welt?","a":"Mandarin-Chinesisch","s":"Über 900 Millionen Muttersprachler; Englisch hat die meisten Sprecher, wenn man Lernende mitzählt.","o":["Englisch","Spanisch","Hindi"]}},{"id":"general-27","c":"General knowledge","l":"Medium","q":"How many keys does a standard piano have?","a":"88","s":"52 white keys and 36 black keys.","o":["76","85","96"],"de":{"q":"Wie viele Tasten hat ein normales Klavier?","a":"88","s":"52 weiße und 36 schwarze Tasten.","o":["76","85","96"]}},{"id":"general-28","c":"General knowledge","l":"Medium","q":"Which wedding anniversary is the silver one?","a":"The 25th","s":"A quarter of a century of marriage.","o":["The 10th","The 20th","The 40th"],"de":{"q":"Der wievielte Hochzeitstag ist die Silberhochzeit?","a":"Der 25.","s":"Ein Vierteljahrhundert Ehe.","o":["Der 10.","Der 20.","Der 40."]}},{"id":"general-29","c":"General knowledge","l":"Easy","q":"Which wedding anniversary is the golden one?","a":"The 50th","s":"Half a century; the 60th is diamond.","o":["The 25th","The 40th","The 60th"],"de":{"q":"Der wievielte Hochzeitstag ist die Goldene Hochzeit?","a":"Der 50.","s":"Ein halbes Jahrhundert; der 60. ist die Diamantene Hochzeit.","o":["Der 25.","Der 40.","Der 60."]}},{"id":"general-30","c":"General knowledge","l":"Hard","q":"What is the largest desert in the world?","a":"Antarctica (the Sahara is the largest hot desert)","s":"A desert is defined by low rainfall, not heat, and Antarctica gets very little.","o":["The Sahara","The Gobi","The Arabian Desert"],"de":{"q":"Was ist die größte Wüste der Welt?","a":"Die Antarktis (die Sahara ist die größte heiße Wüste)","s":"Eine Wüste wird durch wenig Niederschlag definiert, nicht durch Hitze – und in der Antarktis fällt sehr wenig.","o":["Die Sahara","Die Gobi","Die Arabische Wüste"]}},{"id":"general-31","c":"General knowledge","l":"Easy","q":"Which country gave the Statue of Liberty to the USA?","a":"France","s":"A gift for the US centenary of independence, designed by Frédéric Bartholdi.","o":["The United Kingdom","Spain","Italy"],"de":{"q":"Welches Land schenkte den USA die Freiheitsstatue?","a":"Frankreich","s":"Ein Geschenk zum 100. Jahrestag der US-Unabhängigkeit, entworfen von Frédéric Bartholdi.","o":["Großbritannien","Spanien","Italien"]}},{"id":"general-32","c":"General knowledge","l":"Medium","q":"What do you call a word that reads the same backwards as forwards?","a":"A palindrome","s":"Examples: \"level\", \"radar\", \"kayak\".","o":["An anagram","An acronym","A homophone"],"de":{"q":"Wie nennt man ein Wort, das vorwärts und rückwärts gleich gelesen wird?","a":"Ein Palindrom","s":"Beispiele: „Anna“, „Otto“, „Rentner“.","o":["Ein Anagramm","Ein Akronym","Ein Homophon"]}},{"id":"general-33","c":"General knowledge","l":"Easy","q":"Which scientist developed the theory of relativity?","a":"Albert Einstein","s":"Special relativity came in 1905, general relativity in 1915; E = mc² comes from it.","o":["Isaac Newton","Niels Bohr","Max Planck"],"de":{"q":"Welcher Wissenschaftler entwickelte die Relativitätstheorie?","a":"Albert Einstein","s":"Die spezielle Relativitätstheorie kam 1905, die allgemeine 1915; E = mc² stammt daraus.","o":["Isaac Newton","Niels Bohr","Max Planck"]}},{"id":"general-34","c":"General knowledge","l":"Easy","q":"What is the square root of 144?","a":"12","s":"12 × 12 = 144, which is also called a gross.","o":["11","14","16"],"de":{"q":"Was ist die Quadratwurzel aus 144?","a":"12","s":"12 × 12 = 144, auch „ein Gros“ genannt.","o":["11","14","16"]}},{"id":"general-35","c":"General knowledge","l":"Easy","q":"What is 15% of 200?","a":"30","s":"10% is 20 and 5% is 10, so together 30.","o":["15","25","35"],"de":{"q":"Wie viel sind 15 % von 200?","a":"30","s":"10 % sind 20 und 5 % sind 10, zusammen also 30.","o":["15","25","35"]}},{"id":"general-36","c":"General knowledge","l":"Easy","q":"How many seconds are in one hour?","a":"3,600","s":"60 seconds × 60 minutes.","o":["360","1,440","6,000"],"de":{"q":"Wie viele Sekunden hat eine Stunde?","a":"3.600","s":"60 Sekunden × 60 Minuten.","o":["360","1.440","6.000"]}},{"id":"general-37","c":"General knowledge","l":"Medium","q":"Which is the only mammal that can truly fly?","a":"The bat","s":"\"Flying\" squirrels only glide; bats flap their wings.","o":["The flying squirrel","The sugar glider","The flying lemur"],"de":{"q":"Welches ist das einzige Säugetier, das wirklich fliegen kann?","a":"Die Fledermaus","s":"„Flughörnchen“ gleiten nur; Fledermäuse schlagen mit den Flügeln.","o":["Das Flughörnchen","Der Kurzkopfgleitbeutler","Der Riesengleiter"]}},{"id":"general-38","c":"General knowledge","l":"Medium","q":"What is the name of Batman's butler?","a":"Alfred","s":"Alfred Pennyworth looks after Bruce Wayne in Wayne Manor.","o":["Jarvis","Jeeves","Lucius"],"de":{"q":"Wie heißt Batmans Butler?","a":"Alfred","s":"Alfred Pennyworth kümmert sich in Wayne Manor um Bruce Wayne.","o":["Jarvis","Jeeves","Lucius"]}},{"id":"general-39","c":"General knowledge","l":"Easy","q":"Who founded Microsoft together with Paul Allen?","a":"Bill Gates","s":"They founded it in 1975, when Gates was 19.","o":["Steve Jobs","Steve Wozniak","Larry Ellison"],"de":{"q":"Wer gründete Microsoft zusammen mit Paul Allen?","a":"Bill Gates","s":"Sie gründeten es 1975, als Gates 19 war.","o":["Steve Jobs","Steve Wozniak","Larry Ellison"]}},{"id":"general-40","c":"General knowledge","l":"Easy","q":"What does \"www\" stand for in a web address?","a":"World Wide Web","s":"The system of linked pages that runs on the internet.","o":["Wide Web World","World Web Window","Web Wide Wire"],"de":{"q":"Wofür steht „www“ in einer Internetadresse?","a":"World Wide Web","s":"Das System verlinkter Seiten, das über das Internet läuft.","o":["Wide Web World","World Web Window","Web Wide Wire"]}},{"id":"general-41","c":"General knowledge","l":"Medium","q":"Who invented the World Wide Web?","a":"Tim Berners-Lee","s":"He created it in 1989 while working at CERN in Switzerland.","o":["Bill Gates","Vint Cerf","Steve Jobs"],"de":{"q":"Wer erfand das World Wide Web?","a":"Tim Berners-Lee","s":"Er entwickelte es 1989 am CERN in der Schweiz.","o":["Bill Gates","Vint Cerf","Steve Jobs"]}},{"id":"general-42","c":"General knowledge","l":"Hard","q":"What is the national animal of Scotland?","a":"The unicorn","s":"It has appeared on Scottish royal arms since the 1400s as a symbol of purity and strength.","o":["The red deer","The golden eagle","The Highland cow"],"de":{"q":"Was ist das Nationaltier Schottlands?","a":"Das Einhorn","s":"Es erscheint seit dem 15. Jahrhundert im schottischen Königswappen als Symbol für Reinheit und Stärke.","o":["Der Rothirsch","Der Steinadler","Das Hochlandrind"]}},{"id":"general-43","c":"General knowledge","l":"Medium","q":"How many hearts does an octopus have?","a":"3","s":"Two pump blood through the gills and one pumps it around the body.","o":["1","2","4"],"de":{"q":"Wie viele Herzen hat ein Oktopus?","a":"3","s":"Zwei pumpen Blut durch die Kiemen, eines durch den Körper.","o":["1","2","4"]}},{"id":"general-44","c":"General knowledge","l":"Medium","q":"What is the hottest planet in the solar system?","a":"Venus","s":"Its thick carbon dioxide atmosphere traps heat, making it hotter than Mercury.","o":["Mercury","Mars","Jupiter"],"de":{"q":"Welcher Planet ist der heißeste im Sonnensystem?","a":"Venus","s":"Ihre dichte Kohlendioxid-Atmosphäre speichert Wärme – sie ist heißer als Merkur.","o":["Merkur","Mars","Jupiter"]}},{"id":"general-45","c":"General knowledge","l":"Medium","q":"Which day of the week is named after the Norse god Thor?","a":"Thursday","s":"\"Thor's day\"; in German it is Donnerstag, from \"Donner\" (thunder).","o":["Tuesday","Friday","Saturday"],"de":{"q":"Welcher englische Wochentag ist nach dem nordischen Gott Thor benannt?","a":"Thursday (Donnerstag)","s":"„Thor's day“; auch der deutsche Donnerstag kommt vom Donner(gott).","o":["Tuesday","Friday","Saturday"]}},{"id":"general-46","c":"General knowledge","l":"Easy","q":"How many rings are on the Olympic flag?","a":"5","s":"They stand for the five inhabited continents joined by the Games.","o":["4","6","7"],"de":{"q":"Wie viele Ringe sind auf der Olympischen Flagge?","a":"5","s":"Sie stehen für die fünf bewohnten Kontinente, die durch die Spiele verbunden sind.","o":["4","6","7"]}},{"id":"general-47","c":"General knowledge","l":"Easy","q":"How many cards are in a standard deck, without jokers?","a":"52","s":"Four suits of 13 cards each.","o":["32","48","54"],"de":{"q":"Wie viele Karten hat ein normales Kartenspiel ohne Joker?","a":"52","s":"Vier Farben mit je 13 Karten.","o":["32","48","54"]}},{"id":"general-48","c":"General knowledge","l":"Hard","q":"In a standard deck of cards, which king has no moustache?","a":"The King of Hearts","s":"He is also the \"suicide king\", seeming to stab a sword into his own head.","o":["The King of Spades","The King of Clubs","The King of Diamonds"],"de":{"q":"Welcher König in einem normalen französischen Kartenspiel hat keinen Schnurrbart?","a":"Der Herz-König","s":"Er heißt auch „Suicide King“, weil er sich scheinbar ein move diagonally?","a":"The bishop","s":"So each bishop stays on squares of one colour all game.","o":["The rook","The knight","The queen"],"de":{"q":"Welche Schachfigur darf nur diagonal ziehen?","a":"Der Läufer","s":"Deshalb bleibt jeder Läufer die ganze Partie auf Feldern einer Farbe.","o":["Der Turm","Der Springer","Die Dame"]}},{"id":"general-54","c":"General knowledge","l":"Easy","q":"Which chess piece can jump over other pieces?","a":"The knight","s":"It moves in an L-shape: two squares one way, then one to the side.","o":["The bishop","The rook","The king"],"de":{"q":"Welche Schachfigur darf über andere Figuren springen?","a":"Der Springer","s":"Er zieht in L-Form: zwei Felder in eine Richtung, dann eines zur Seite.","o":["Der Läufer","Der Turm","Der König"]}},{"id":"general-55","c":"General knowledge","l":"Medium","q":"What is 2 to the power of 10?","a":"1,024","s":"That's why a kilobyte was traditionally 1,024 bytes.","o":["1,000","512","2,048"],"de":{"q":"Wie viel ist 2 hoch 10?","a":"1.024","s":"Deshalb hatte ein Kilobyte traditionell 1.024 Byte.","o":["1.000","512","2.048"]}},{"id":"general-56","c":"General knowledge","l":"Medium","q":"What is the smallest prime number?","a":"2","s":"It is also the only even prime number.","o":["1","3","0"],"de":{"q":"Was ist die kleinste Primzahl?","a":"2","s":"Sie ist auch die einzige gerade Primzahl.","o":["1","3","0"]}},{"id":"general-57","c":"General knowledge","l":"Easy","q":"How many degrees are in a right angle?","a":"90","s":"A quarter of a full 360-degree turn.","o":["45","100","180"],"de":{"q":"Wie viele Grad hat ein rechter Winkel?","a":"90","s":"Eine Vierteldrehung von 360 Grad.","o":["45","100","180"]}},{"id":"general-58","c":"General knowledge","l":"Easy","q":"What do the angles of a triangle add up to?","a":"180 degrees","s":"True for every flat triangle, whatever its shape.","o":["90 degrees","270 degrees","360 degrees"],"de":{"q":"Wie viel ergeben die Winkel eines Dreiecks zusammen?","a":"180 Grad","s": ature","l":"Medium","q":"Roughly how long does sunlight take to reach Earth?","a":"About 8 minutes","s":"The Sun is about 150 million km away.","o":["About 8 seconds","About 1 hour","About 20 minutes"],"de":{"q":"Wie lange braucht das Sonnenlicht ungefähr bis zur Erde?","a":"Etwa 8 Minuten","s":"Die Sonne ist rund 150 Millionen km entfernt.","o":["Etwa 8 Sekunden","Etwa 1 Stunde","Etwa 20 Minuten"]}},{"id":"science-10","c":"Science & nature","l":"Easy","q":"What is the largest planet in the solar system?","a":"Jupiter","s":"More than twice the mass of all the other planets combined.","o":["Saturn","Neptune","Uranus"],"de":{"q":"Welcher ist der größte Planet im Sonnensystem?","a":"Jupiter","s":"Mehr als doppelt so schwer wie alle anderen Planeten zusammen.","o":["Saturn","Neptun","Uranus"]}},{"id":"science-11","c":"Science & nature","l":"Easy","q":"Which planet is known as the Red Planet?","a":"Mars","s":"Iron oxide (rust) in its soil makes it look red.","o":["Venus","Jupiter","Mercury"],"de":{"q":"Welcher Planet wird „der Rote Planet“ genannt?","a":"Mars","s":"Eisenoxid (Rost) im Boden lässt ihn rot aussehen.","o":["Venus","Jupiter","Merkur"]}},{"id":"science-12","c":"Science & nature","l":"Easy","q":"How many planets are in our solar system?","a":"8","s":"Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune.","o":["7","9","10"],"de":{"q":"Wie viele Planeten hat unser Sonnensystem?","a":"8","s":"Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus, Neptun.","o":["7","9","10"]}},{"id":"science-13","c":"Science & nature","l":"Easy","q":"Which former planet was reclassified as a dwarf planet in 2006?","a":"Pluto","s":"Pluto hasn't cleared other objects from its orbit, one of the tests for a full planet.","o":["Ceres","Eris","Neptune"],"de":{"q":"Welcher ehemalige Planet wurde 2006 zum Zwergplaneten herabgestuft?","a":"Pluto","s":"Pluto hat seine Umlaufbahn nicht von anderen Objekten freigeräumt – eine Bedingung für einen echten Planeten.","o":["Ceres","Eris","Neptun"]}},{"id":"science-14","c":"Science & nature","l":"Hard","q":"Apart from the Sun, which is the closest star to Earth?","a":"Proxima Centauri","s":"About 4.2 light years away.","o":["Sirius","Polaris","Betelgeuse"],"de":{"q":"Welcher Stern ist nach der Sonne der Erde am nächsten?","a":"Proxima Centauri","s":"Etwa 4,2 Lichtjahre entfernt.","o":["Sirius","Polarstern","Beteigeuze"]}},{"id":"science-15","c":"Science & nature","l":"Easy","q":"What is the largest organ of the human body?","a":"The skin","s":"It weighs about 3–4 kg in an adult.","o":["The liver","The brain","The lungs"],"de":{"q":"Was ist das größte Organ des menschlichen Körpers?","a":"Die Haut","s":"Bei Erwachsenen wiegt sie etwa 3–4 kg.","o":["Die Leber","Das Gehirn","Die Lunge"]}},{"id":"science-16","c":"Science & nature","l":"Medium","q":"How many bones are in the adult human body?","a":"206","s":"Babies are born with about 300; some fuse as they grow.","o":["186","212","250"],"de":{"q":"Wie viele Knochen hat ein erwachsener Mensch?","a":"206","s":"Babys haben etwa 300; einige verwachsen beim Wachsen.","o":["186","212","250"]}},{"id":"science-17","c":"Science & nature","l":"Hard","q":"What is the smallest bone in the human body?","a":"The stapes (stirrup)","s":"It is in the middle ear and is about 3 mm long.","o":["The anvil","The coccyx","The hyoid"],"de":{"q":"Was ist der kleinste Knochen des menschlichen Körpers?","a":"Der Steigbügel (Stapes)","s":"Er sitzt im Mittelohr und ist etwa 3 mm lang.","o":["Der Amboss","Das Steißbein","Das Zungenbein"]}},{"id":"science-18","c":"Science & nature","l":"Medium","q":"What is the longest bone in the human body?","a":"The femur (thigh bone)","s":"It is also the strongest bone.","o":["The tibia","The humerus","The spine"],"de":{"q":"Was ist der längste Knochen des menschlichen Körpers?","a":"Der Oberschenkelknochen (Femur)","s":"Er ist auch der stärkste Knochen.","o":["Das Schienbein","Der Oberarmknochen","Die Wirbelsäule"]}},{"id":"science-19","c":"Science science-24","c":"Science & nature","l":"Medium","q":"How many chromosomes are in a normal human body cell?","a":"46","s":"23 pairs, one set from each parent.","o":["23","44","48"],"de":{"q":"Wie viele Chromosomen hat eine normale menschliche Körperzelle?","a":"46","s":"23 Paare, je ein Satz von jedem Elternteil.","o":["23","44","48"]}},{"id":"science-25","c":"Science & nature","l":"Easy","q":"Who developed the theory of evolution by natural selection?","a":"Charles Darwin","s":"Published in \"On the Origin of Species\" in 1859.","o":["Gregor Mendel","Alfred Russel Wallace","Jean-Baptiste Lamarck"],"de":{"q":"Wer entwickelte die Evolutionstheorie durch natürliche Selektion?","a":"Charles Darwin","s":"Veröffentlicht 1859 in „Über die Entstehung der Arten“.","o":["Gregor Mendel","Alfred Russel Wallace","Jean-Baptiste Lamarck"]}},{"id":"science-26","c":"Science & nature","l":"Hard","q":"What was the name of the ship Darwin sailed on?","a":"HMS Beagle","s":"Its voyage from 1831 to 1836 included the Galapagos Islands.","o":["HMS Endeavour","HMS Bounty","HMS Victory"],"de":{"q":"Wie hieß das Schiff, mit dem Darwin reiste?","a":"HMS Beagle","s":"Die Reise von 1831 bis 1836 führte auch zu den Galápagos-Inseln.","o":["HMS Endeavour","HMS Bounty","HMS Victory"]}},{"id":"science-27","c":"Science & nature","l":"Medium","q":"Who discovered penicillin?","a":"Alexander Fleming","s":"In 1928, by noticing mould killing bacteria on a dish he'd left out.","o":["Louis Pasteur","Robert Koch","Joseph Lister"],"de":{"q":"Wer entdeckte das Penicillin?","a":"Alexander Fleming","s":"1928 – er bemerkte, dass Schimmel auf einer liegengelassenen Schale Bakterien abtötete.","o":["Louis Pasteur","Robert Koch","Joseph Lister"]}},{"id":"science-28","c":"Science & nature","l":"Easy","q":"Who described the laws of motion and gravity in the 1680s?","a":"Isaac Newton","s":"Published in his \"Principia\" in 1687.","o":["Galileo Galilei","Johannes Kepler","Albert Einstein"],"de":{"q":"Wer beschrieb in den ium","q":"Which element has atomic number 1?","a":"Hydrogen","s":"It has just one proton, making it the lightest element.","o":["Helium","Oxygen","Carbon"],"de":{"q":"Welches Element hat die Ordnungszahl 1?","a":"Wasserstoff","s":"Es hat nur ein Proton und ist damit das leichteste Element.","o":["Helium","Sauerstoff","Kohlenstoff"]}},{"id":"science-35","c":"Science & nature","l":"Medium","q":"What is the most common element in the universe?","a":"Hydrogen","s":"About three-quarters of all normal matter; stars are mostly hydrogen.","o":["Helium","Oxygen","Carbon"],"de":{"q":"Welches Element ist im Universum am häufigsten?","a":"Wasserstoff","s":"Etwa drei Viertel aller normalen Materie; Sterne bestehen größtenteils daraus.","o":["Helium","Sauerstoff","Kohlenstoff"]}},{"id":"science-36","c":"Science & nature","l":"Medium","q":"Which metal is liquid at room temperature?","a":"Mercury","s":"It was used in old thermometers.","o":["Lead","Tin","Aluminium"],"de":{"q":"Welches Metall ist bei Raumtemperatur flüssig?","a":"Quecksilber","s":"Es wurde früher in Thermometern verwendet.","o":["Blei","Zinn","Aluminium"]}},{"id":"science-37","c":"Science & nature","l":"Hard","q":"Which planet rotates on its side?","a":"Uranus","s":"It is tilted about 98 degrees, probably after a huge collision long ago.","o":["Neptune","Saturn","Venus"],"de":{"q":"Welcher Planet rotiert auf der Seite liegend?","a":"Uranus","s":"Seine Achse ist um etwa 98 Grad geneigt, vermutlich nach einem riesigen Zusammenstoß.","o":["Neptun","Saturn","Venus"]}},{"id":"science-38","c":"Science & nature","l":"Medium","q":"Which planet has the Great Red Spot?","a":"Jupiter","s":"A giant storm bigger than Earth that has lasted for centuries.","o":["Mars","Saturn","Neptune"],"de":{"q":"Auf welchem Planeten ist der Große Rote Fleck?","a":"Jupiter","s":"Ein riesiger Sturm, größer als die Erde, der seit Jahrhunderten tobt.","o":["Mars","Saturn","Neptun"]}},{"id":"science-39","c":"Science & nature","l":"Easy","q":"What is the centre of an atom called?","a":"The nucleus","s":"It holds protons and neutrons; electrons move around it.","o":["The electron shell","The proton","The core cell"],"de":{"q":"Wie heißt das Zentrum eines Atoms?","a":"Der Atomkern","s":"Er enthält Protonen und Neutronen; Elektronen bewegen sich darum.","o":["Die Elektronenhülle","Das Proton","Die Kernzelle"]}},{"id":"science-40","c":"Science & nature","l":"Easy","q":"Which particle in an atom has a negative charge?","a":"The electron","s":"Protons are positive and neutrons have no charge.","o":["The proton","The neutron","The photon"],"de":{"q":"Welches Teilchen im Atom ist negativ geladen?","a":"Das Elektron","s":"Protonen sind positiv, Neutronen ungeladen.","o":["Das Proton","Das Neutron","Das Photon"]}},{"id":"science-41","c":"Science & nature","l":"Easy","q":"What does a seismograph measure?","a":"Earthquakes","s":"It records how the ground shakes.","o":["Wind speed","Air pressure","Rainfall"],"de":{"q":"Was misst ein Seismograf?","a":"Erdbeben","s":"Er zeichnet auf, wie stark der Boden bebt.","o":["Windgeschwindigkeit","Luftdruck","Niederschlag"]}},{"id":"science-42","c":"Science & nature","l":"Easy","q":"Which layer of the atmosphere protects us from UV rays?","a":"The ozone layer","s":"The 1987 Montreal Protocol banned chemicals that were damaging it.","o":["The ionosphere","The troposphere","The magnetosphere"],"de":{"q":"Welche Schicht der Atmosphäre schützt uns vor UV-Strahlen?","a":"Die Ozonschicht","s":"Das Montreal-Protokoll von 1987 verbot Chemikalien, die sie schädigten.","o":["Die Ionosphäre","Die Troposphäre","Die Magnetosphäre"]}},{"id":"science-43","c":"Science & nature","l":"Hard","q":"What is the study of fungi called?","a":"Mycology","s":"From the Greek \"mykēs\", meaning mushroom.","o":["Botany","Entomology","Virology"],"de":{"q":"Wie heißt die Lehre von den Pilzen?","a":"Mykologie","s":"Vom griechischen „mykes“, Pilz.","o":["Botanik","Entomologie","Virologie"]}},{"id":"science-44","c":"Sci gg-laying mammal has a duck-like bill?","a":"The platypus","s":"Males have venomous spurs on their back legs.","o":["The echidna","The otter","The armadillo"],"de":{"q":"Welches eierlegende Säugetier hat einen entenähnlichen Schnabel?","a":"Das Schnabeltier","s":"Männchen haben giftige Sporne an den Hinterbeinen.","o":["Der Ameisenigel","Der Otter","Das Gürteltier"]}},{"id":"science-50","c":"Science & nature","l":"Medium","q":"What is the largest fish in the world?","a":"The whale shark","s":"It can reach about 18 metres but eats only plankton.","o":["The great white shark","The blue whale","The basking shark"],"de":{"q":"Was ist der größte Fisch der Welt?","a":"Der Walhai","s":"Er wird bis zu etwa 18 Meter lang, frisst aber nur Plankton.","o":["Der Weiße Hai","Der Blauwal","Der Riesenhai"]}},{"id":"science-51","c":"Science & nature","l":"Easy","q":"What do giant pandas mainly eat?","a":"Bamboo","s":"They eat for up to 14 hours a day.","o":["Eucalyptus","Fish","Berries"],"de":{"q":"Was fressen Große Pandas hauptsächlich?","a":"Bambus","s":"Sie fressen bis zu 14 Stunden am Tag.","o":["Eukalyptus","Fisch","Beeren"]}},{"id":"science-52","c":"Science & nature","l":"Medium","q":"Which is the only bird that can fly backwards?","a":"The hummingbird","s":"Its wings beat up to about 80 times a second.","o":["The swift","The kingfisher","The sparrow"],"de":{"q":"Welcher Vogel kann als einziger rückwärts fliegen?","a":"Der Kolibri","s":"Seine Flügel schlagen bis zu etwa 80-mal pro Sekunde.","o":["Der Mauersegler","Der Eisvogel","Der Spatz"]}},{"id":"science-53","c":"Science & nature","l":"Medium","q":"Which animals are humans' closest living relatives?","a":"Chimpanzees and bonobos","s":"We share about 98% of our DNA with them.","o":["Gorillas","Orangutans","Gibbons"],"de":{"q":"Welche Tiere sind die nächsten lebenden Verwandten des Menschen?","a":"Schimpansen und Bonobos","s":"Wir teilen etwa 98 % unserer DNA mit ihnen.","o":["Gorillas","Orang-Utans","Gibbons"]}},{"id":"scien ician still in office after their successor has been chosen?","a":"A lame duck","s":"Common in the US between the November election and the January handover.","o":["A dark horse","A sitting duck","A backbencher"],"de":{"q":"Wie nennt man einen Politiker, der noch im Amt ist, obwohl sein Nachfolger schon feststeht?","a":"Eine „lahme Ente“ (lame duck)","s":"In den USA typisch zwischen der Wahl im November und der Amtsübergabe im Januar.","o":["Ein „dark horse“","Eine „sitting duck“","Ein Hinterbänkler"]}},{"id":"politics-50","c":"Politics","l":"Medium","q":"In parliament, what is the person who chairs debates in the UK House of Commons called?","a":"The Speaker","s":"They must stay politically neutral and are known for calling \"Order!\".","o":["The Chancellor","The Whip","The Chief Justice"],"de":{"q":"Wie heißt die Person, die im britischen Unterhaus die Debatten leitet?","a":"The Speaker (Parlamentspräsident)","s":"Er muss politisch neutral bleiben und ist für den Ruf „Order!“ bekannt.","o":["Der Chancellor","Der Whip","Der Oberste Richter"]}},{"id":"politics-51","c":"Politics","l":"Easy","q":"What is the official residence of the French president called?","a":"The Élysée Palace","s":"In Paris, near the Champs-Élysées; presidents have lived there since 1848.","o":["The Louvre","Versailles","Matignon"],"de":{"q":"Wie heißt der Amtssitz des französischen Präsidenten?","a":"Der Élysée-Palast","s":"In Paris nahe den Champs-Élysées; Präsidenten wohnen dort seit 1848.","o":["Der Louvre","Versailles","Matignon"]}},{"id":"politics-52","c":"Politics","l":"Medium","q":"How long is a French president's term of office?","a":"5 years","s":"It was cut from seven years in 2002.","o":["4 years","6 years","7 years"],"de":{"q":"Wie lange dauert die Amtszeit des französischen Präsidenten?","a":"5 Jahre","s":"2002 wurde sie von sieben Jahren verkürzt.","o":["4 Jahre","6 Jahre","7 Jahre"]}},{"id":"politics-53","c":"Politics","l":"Easy","q":"In which Berlin building does the Bundestag m nment","s":"If the government loses, it may have to resign or call an election.","o":["A vote to change the constitution","A vote to leave the EU","A vote on the budget"],"de":{"q":"Was ist ein „Misstrauensvotum“?","a":"Eine Abstimmung, ob das Parlament der Regierung noch vertraut","s":"Verliert die Regierung, muss sie womöglich zurücktreten oder Neuwahlen ansetzen.","o":["Eine Abstimmung über eine Verfassungsänderung","Eine Abstimmung über den EU-Austritt","Eine Abstimmung über den Haushalt"]}},{"id":"politics-58","c":"Politics","l":"Hard","q":"What is special about Germany's \"constructive\" vote of no confidence?","a":"Parliament must elect a new chancellor at the same time","s":"Designed to avoid the instability of the Weimar Republic; it has succeeded only once, in 1982.","o":["It needs a two-thirds majority","It must be approved by the president","It can only be held once per term"],"de":{"q":"Was ist das Besondere am konstruktiven Misstrauensvotum in Deutschland?","a":"Der Bundestag muss gleichzeitig einen neuen Kanzler wählen","s":"Gedacht gegen die Instabilität der Weimarer Republik; erfolgreich war es nur einmal, 1982.","o":["Es braucht eine Zweidrittelmehrheit","Der Bundespräsident muss zustimmen","Es darf nur einmal pro Wahlperiode stattfinden"]}},{"id":"politics-59","c":"Politics","l":"Easy","q":"In the UK, what does \"MP\" stand for?","a":"Member of Parliament","s":"There are 650 MPs in the House of Commons.","o":["Minister of Policy","Mayor of the Parish","Military Police"],"de":{"q":"Wofür steht in Großbritannien „MP“?","a":"Member of Parliament (Abgeordneter)","s":"Im Unterhaus sitzen 650 Abgeordnete.","o":["Minister of Policy","Mayor of the Parish","Military Police"]}},{"id":"politics-60","c":"Politics","l":"Medium","q":"How many justices sit on the US Supreme Court?","a":"9","s":"The number has been nine since 1869.","o":["7","11","12"],"de":{"q":"Wie viele Richter sitzen am Obersten Gerichtshof der USA?","a":"9","s":"Seit 1869 sind es neun.","o": const diffSel=new Set(LS.get("diff",["Easy","Medium","Hard"]));
function renderBuilder(){
  $("diffChips").replaceChildren(...["Easy","Medium","Hard"].map(l=>chip(lvlName(l),diffSel.has(l),()=>{diffSel.has(l)?diffSel.delete(l):diffSel.add(l);if(!diffSel.size)diffSel.add(l);LS.set("diff",[...diffSel]);renderBuilder()})));

    sel.value=prev[i]||saved[i]||"random"; sel.onchange=()=>LS.set("roundCats",[...$("roundSel").querySelectorAll("select")].map(s=>s.value));
    row.innerHTML=`<span>${t("round")} ${i+1}</span>`; row.append(sel); return row}));

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(e){
  e.preventDefault(); $("buildMsg").textContent="";
  const per=+$("perRound").value; const choices=[...$("roundSel").querySelectorAll("select")].map(s=>s.value);
  const used=new Set($("avoidUsed").checked?S.used:[]); const taken=new Set();
  const pool=d=>diffSel.has(d.l)&&!used.has(d.id)&&!taken.has(d.id);
  // Pick specific categories first, then random ones from what's left
  const specific=new Set(choices.filter(c=>c!=="random"&&c!=="mixed"));
  const randomCats=shuffle(CATS.filter(c=>!specific.has(c.slug)&&c.slug!=="kids").map(c=>c.slug));
  const rounds=[];
  for(const ch of choices){
    let cat=ch; if(ch==="random"){cat=randomCats.find(s=>DATA.filter(d=>catOf(d).slug===s&&pool(d)).length>=per); if(cat) randomCats.splice(randomCats.indexOf(cat),1)}
    if(!cat){$("buildMsg").textContent=t("notEnough");return}
    let cand=DATA.filter(d=>pool(d)&&(cat==="mixed"?catOf(d).slug!=="kids":catOf(d).slug===cat));
    if(cat==="mixed"){ // spread across categories
      const by={}; shuffle(cand).forEach(d=>(by[d.c]=by[d.c]||[]).push(d)); const keys=shuffle(Object.keys(by)); cand=[];
      while(cand.length<per&&keys.some(k=>by[k].length)) for(const k of keys){if(by[k].length&&cand.length<per)cand.push(by[k].pop())}
    } else cand=shuffle(cand).slice(0,per);
    if(cand.length<per){$("buildMsg").textContent=t("notEnough");return}
    // Order within a round: easier first
    const rank={Easy:0,Medium:1,Hard:2}; cand.sort((a,b)=>rank[a.l]-rank[b.l]);
    cand.forEach(d=>taken.add(d.id));
    rounds.push({cat,ids:cand.map(d=>d.id)});
  }
  S.quiz={rounds,created:Date.now()}; LS.set("quiz",S.quiz); track("generate-quiz");
  S.used=[...new Set([...S.used,...taken])]; LS.set("used",S.used);
  renderBuilder();
}

function startTimer(){const total=S.timer;$("ring").hidden=!total||slides[si].type!=="q";if(!total||slides[si].type!=="q")return;tLeft=total;drawRing(total);
  tmr=setInterval(()=>{tLeft--;drawRing(total);if(tLeft<=0){clearInterval(tmr);tmr=null;beep();$("ring").title=t("timeUp")}},1000)}
function stopTimer(keep){if(tmr){clearInterval(tmr);tmr=null}if(!keep)$("ring").hidden=true}
$("ring").onclick=()=>{stopTimer();startTimer()};
$("timerSel").onchange=e=>{S.timer=+e.target.value;LS.set("timer",S.timer);if(audio==null){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}stopTimer();startTimer()};
$("choicesBtn").onclick=()=>{S.choices=!S.choices;LS.set("choices",S.choices);$("choicesBtn").setAttribute("aria-pressed",S.choices);const r=revealed;showSlide();if(r)flip()};
$("teamsBtn").onclick=()=>$("teams").classList.toggle("on");
$("fsBtn").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():$("host").requestFullscreen()}catch(e){}};
$("hostBtn").onclick=()=>{track("host-cards");openHost(false)}; $("hostQuiz").onclick=()=>{track("host-quiz");openHost(true)};
$("hostClose").onclick=closeHost; $("reveal").onclick=flip; $("next").onclick=()=>move(1); $("prev").onclick=()=>move(-1);
document.addEventListener("keydown",e=>{
  if(!$("host").classList.contains("on")||e.target.matches("input,select,textarea")) return;
  if(e.key==="ArrowRight") move(1); else if(e.key==="ArrowLeft") move(-1);
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();if(slides[si].type==="q")flip();else move(1)}
  else if(e.key==="Escape"&&!document.fullscreenElement) closeHost();
  else if(e.key.toLowerCase()==="t") $("teams").classList.toggle("on");
});
function renderTeams(){
  $("teamList").replaceChildren(...S.teams.map((tm,i)=>{const r=document.createElement("div");r.className="team";
    r.innerHTML=`<span class="nm" title="${esc(tm.n)}">${esc(tm.n)}</span><button aria-label="minus">−</button><span class="sc">${tm.s}</span><button aria-label="plus">+</button><button aria-label="remove" class="linkbtn">✕</button>`;
    const [m,p,x]=r.querySelectorAll("button"); m.onclick=()=>{tm.s--;saveTeams()}; p.onclick=()=>{tm.s++;saveTeams()}; x.onclick=()=>{S.teams.splice(i,1);saveTeams()}; return r}));
}
function saveTeams(){LS.set("teams",S.teams);renderTeams();const s=slides[si];if(s&&s.type==="scores")showSlide()}
$("teamForm").onsubmit=e=>{e.preventDefault();const n=$("teamName").value.trim();if(!n)return;S.teams.push({n,s:0});$("teamName").value="";saveTeams()};
$("showBoard").onclick=()=>{stopTimer();$("stage").innerHTML=`<div class="slide"><h2>${t("leaderboard")}</h2>${board()}</div>`};
(()=>{let armed=false;$("resetScores").onclick=()=>{if(!armed){armed=true;$("resetScores").textContent=t("resetScoresSure");setTimeout(()=>{armed=false;$("resetScores").textContent=t("resetScores")},3000);return}
  S.teams.forEach(x=>x.s=0);saveTeams();armed=false;$("resetScores").textContent=t("resetScores")}})();

/* ---------- Views, hash links, language ---------- */
function setView(v){S.view=v;$("cardsView").hidden=v!=="cards";$("roundsView").hidden=v!=="rounds";
  $("tabCards").setAttribute("aria-current",v==="cards");$("tabRounds").setAttribute("aria-current",v==="rounds");if(v==="rounds")renderBuilder()}
$("tabCards").onclick=()=>{if(location.hash==="#rounds")history.replaceState(null,"",S.cat==="all"?location.pathname+location.search:"#"+S.cat);setView("cards")};
$("tabRounds").onclick=()=>{history.replaceState(null,"","#rounds");setView("rounds")};
function fromHash(){const h=decodeURIComponent(location.hash.slice(1));
  if(h==="rounds"){setView("rounds");return}
  setView("cards"); const c=CATS.find(c=>c.slug===h); if(c&&S.cat!==c.slug){S.cat=c.slug;S.shown=120;renderChips();render()} else if(!h&&S.cat!=="all"){S.cat="all";renderChips();render()}}
window.addEventListener("hashchange",fromHash);
$("langBtn").onclick=()=>{S.lang=S.lang==="de"?"en":"de";track("language-"+S.lang);LS.set("lang",S.lang);applyI18n();renderChips();render();renderStats();if(S.view==="rounds")renderBuilder();if($("host").classList.contains("on")){const r=revealed;showSlide();if(r)flip()}};
$("modeFlip").onclick=()=>{S.mode="flip";LS.set("mode",S.mode);renderChips();render()};
$("modeMC").onclick=()=>{track("mode-multiple-choice");S.mode="mc";LS.set("mode",S.mode);renderChips();render()};
$("more").onclick=()=>{S.shown+=120;render()};
$("search").oninput=e=>{S.q=e.target.value.trim();S.shown=120;renderChips();render()};
$("clearFilters").onclick=()=>{S.lvl="all";S.status="all";S.q="";$("search").value="";setCat("all")};
$("openSide").onclick=()=>$("side").classList.add("open"); $("closeSide").onclick=()=>$("side").classList.remove("open");
$("shuffle").onclick=()=>{shuffle(S.order);render()};
$("flipAll").onclick=()=>{S.allFlipped=!S.allFlipped;applyI18n();render()};
$("nRounds").oninput=renderBuilder;
$("builderForm").onsubmit=generate;
$("printChoices").onchange=e=>LS.set("printChoices",e.target.checked);

applyI18n(); renderChips(); renderStats();
{const h=location.hash.slice(1);const c=CATS.find(c=>c.slug===h);if(c)S.cat=c.slug;renderChips()}
render(); fromHash();

if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
