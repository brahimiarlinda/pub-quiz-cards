  :root{
    --slab:"Zilla Slab",Rockwell,"Roboto Slab",Georgia,serif;
    --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
    --bg:#e5e9e3; --panel:#fffefa; --ink:#17231d; --muted:#5b675f; --line:#cdd5cd;
    --snug:#173127; --snug-ink:#f3efe3; --brass:#c08a2c; --brass-ink:#1b1408;
    --accent:#173127; --accent-ink:#f3efe3; --back:#173127; --back-ink:#fbf6ea;
    --easy:#2f7a4a; --medium:#a8740e; --hard:#a8322f; --good:#2f7a4a; --bad:#a8322f;
    --shadow:0 1px 0 rgba(23,35,29,.08),0 6px 16px -8px rgba(23,35,29,.35);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#101a15;--panel:#18241e;--ink:#ece8dc;--muted:#9aa69d;--line:#2a3a31;
      --snug:#0b130f;--accent:#e2b65a;--accent-ink:#1b1408;--brass:#e2b65a;--back:#24453a;--back-ink:#fbf6ea;
      --easy:#7cc796;--medium:#e2b65a;--hard:#ef8a85;--good:#7cc796;--bad:#ef8a85;--shadow:0 1px 0 rgba(0,0,0,.4),0 8px 18px -10px rgba(0,0,0,.8)}
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
  a{color:inherit}
  header.app{position:sticky;top:0;z-index:5;background:var(--snug);color:var(--snug-ink);border-bottom:3px solid var(--brass)}
  .wrap{max-width:1180px;margin:0 auto;padding:12px 18px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font:700 1.5rem/1 var(--slab);margin:0;letter-spacing:-.005em;display:flex;align-items:center;gap:10px}
  h1 b{color:var(--brass);font-weight:inherit}
  .mat{width:30px;height:30px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 3px var(--snug),inset 0 0 0 5px var(--brass);flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--snug);font:700 1rem var(--slab)}
  .tabs{display:flex;gap:4px;margin-left:8px}
  .tab{border:none;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:color-mix(in srgb,var(--snug-ink) 72%,transparent);font:inherit;font-weight:700;font-size:.92rem}
  .tab:hover{color:var(--snug-ink);border-color:transparent}
  .tab[aria-current=true]{background:color-mix(in srgb,var(--snug-ink) 14%,transparent);color:var(--snug-ink)}
  header.app .btn{background:transparent;color:var(--snug-ink);border-color:color-mix(in srgb,var(--snug-ink) 30%,transparent)}
  header.app .btn:hover{border-color:var(--brass)}
  .spacer{flex:1}
  .count{color:var(--muted);font-size:.88rem}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
  input[type=search],input[type=text],input[type=number],input[type=email],select{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:.95rem}
  input[type=search]{flex:1 1 220px;min-width:0}
  button,.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
  button:hover,.chip:hover{border-color:var(--ink)}
  :focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .chip[aria-pressed=true],.seg [aria-pressed=true]{background:var(--snug);color:var(--snug-ink);border-color:var(--snug)}
  .btn{border-radius:10px;padding:8px 12px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
  .btn.primary:hover{border-color:var(--ink)}
  .btn.small{padding:5px 9px;font-size:.8rem}
  .chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:thin;padding-bottom:2px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:none;border-radius:0;padding:7px 11px}
  .label{font-size:.85rem;color:var(--muted);font-weight:700}
  .stats{font-size:.85rem;color:var(--muted)}
  .stats b.good{color:var(--good)} .stats b.bad{color:var(--bad)}
  .linkbtn{border:none;background:none;padding:0;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:.85rem}
  main .wrap{padding-top:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:18px}
  .card{perspective:1000px;height:250px;cursor:pointer;outline:none;position:relative}
  .inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:16px 18px 14px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .front{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--c,var(--accent))}
  .back{background:var(--c,var(--back));color:var(--back-ink);transform:rotateY(180deg);background-image:radial-gradient(circle at 100% 0,rgba(255,255,255,.12) 0 70px,transparent 71px)}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--c,var(--muted))}
  .pips{display:inline-flex;gap:3px;align-items:center}
  .pips i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.22}
  .pips i.on{opacity:1}
  .lvl{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.74rem}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:.74rem;color:var(--muted)}
  .back .meta{color:color-mix(in srgb,var(--back-ink) 82%,transparent)}
  .front .lvl,.mc .lvl{color:var(--muted)}
  .mc .meta .no{color:var(--muted);font-weight:400}
  .back .lvl{color:inherit}
  .mark{font-weight:700;margin-left:6px}
  .mark.got{color:var(--good)} .mark.missed{color:var(--bad)}
  .q{font:600 1.18rem/1.3 var(--slab);margin:auto 0;padding:8px 0;text-wrap:balance}
  .bq{font-size:.78rem;opacity:.75;margin-top:6px;line-height:1.3}
  .a{font:700 1.35rem/1.2 var(--slab);margin:8px 0 6px;text-wrap:balance}
  .s{font-size:.86rem;opacity:.92;overflow:auto;flex:1}
  .hint{font-size:.74rem;color:var(--muted)}
  .actions{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .actions button{font-size:.78rem;padding:4px 9px;background:transparent;color:inherit;border-color:color-mix(in srgb,var(--back-ink) 40%,transparent)}
  .actions button[aria-pressed=true]{background:var(--back-ink);color:var(--back)}
  .actions a{font-size:.74rem;margin-left:auto;opacity:.8}
  .card:focus-visible .face,.mc:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .card:focus-visible{outline:none}
  /* Multiple choice cards */
  .mc{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--c,var(--accent));border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
  .mc .q{margin:4px 0;padding:0}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;border-radius:10px;padding:7px 10px;white-space:normal;line-height:1.3;display:flex;gap:8px}
  .opt b{color:var(--muted)}
  .opt.right{background:color-mix(in srgb,var(--good) 18%,var(--panel));border-color:var(--good)}
  .opt.wrong{background:color-mix(in srgb,var(--bad) 15%,var(--panel));border-color:var(--bad)}
  .mc .s{font-size:.85rem;color:var(--muted);flex:none}
  .mc .actions{margin-top:0}
  .mc .actions a{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  .more{display:block;margin:22px auto 40px}
  /* Round builder */
  .builder{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
  @media (max-width:820px){.builder{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .panel h2{font:700 1.4rem var(--slab);margin:0 0 10px}
  .field{margin:12px 0}
  .field>label,.field>.label{display:block;margin-bottom:5px}
  .check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;margin:8px 0}
  .roundsel{display:grid;gap:6px}
  .roundsel div{display:flex;align-items:center;gap:8px}
  .roundsel span{width:68px;font-size:.85rem;color:var(--muted)}
  .roundsel select{flex:1}
  .quiz h3{font:700 1.15rem var(--slab);margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
  .quiz h3 small{font:400 .82rem var(--sans);color:var(--muted)}
  .quiz ol{margin:0;padding-left:24px}
  .quiz li{margin:4px 0}
  .quiz .ans{color:var(--accent);font-weight:600}
  .quiz.hide-ans .ans{display:none}
  .msg{color:var(--bad);font-size:.9rem;margin-top:8px}
  /* Host mode */
  #host{position:fixed;inset:0;z-index:20;background:var(--snug);color:var(--snug-ink);display:none;flex-direction:column;--line:color-mix(in srgb,var(--snug-ink) 18%,transparent);--muted:color-mix(in srgb,var(--snug-ink) 65%,transparent)}
  #host .bar .btn,#host .nav .btn:not(.primary){background:transparent;color:var(--snug-ink);border-color:color-mix(in srgb,var(--snug-ink) 28%,transparent)}
  #host .card .face.front{color:var(--ink)}
  #host .front .meta{color:var(--c)}
  #host .front .lvl{color:#5b675f}
  input[type=checkbox],input[type=radio]{accent-color:var(--snug);width:16px;height:16px}
  @media (max-width:520px){h1 .word{display:none}.mat{width:34px;height:34px;font-size:1.15rem}}
  #host.on{display:flex}
  #host .bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  #host .pos{font-weight:700}
  #host .body{flex:1;display:flex;min-height:0}
  #host .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px;min-width:0}
  #host .card{height:min(56vh,440px);width:min(780px,100%)}
  #host .q{font-size:clamp(1.25rem,3.2vw,2rem)}
  #host .a{font-size:clamp(1.35rem,3.4vw,2.2rem)}
  #host .s{font-size:clamp(.95rem,1.7vw,1.12rem)}
  #host .bq{font-size:clamp(.85rem,1.5vw,1rem)}
  #host .hostopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  #host .hostopts div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:clamp(.9rem,1.7vw,1.1rem)}
  #host .back .hostopts div{border-color:color-mix(in srgb,var(--back-ink) 30%,transparent)}
  #host .back .hostopts div.right{background:var(--back-ink);color:var(--back);font-weight:700}
  .slide{width:min(780px,100%);text-align:center;padding:30px}
  .slide h2{font:700 clamp(2.2rem,6.5vw,4rem)/1.05 var(--slab);margin:0 0 10px;text-wrap:balance}
  .slide p{color:var(--muted);font-size:1.15rem;margin:0}
  .board{width:min(560px,100%);margin:18px auto 0;display:grid;gap:8px;text-align:left}
  .board.two{width:min(980px,100%);grid-template-columns:1fr 1fr;grid-auto-flow:column;gap:6px 14px}
  .board .bt{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--snug-ink) 7%,transparent);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:1.2rem}
  .board.two .bt{font-size:1.02rem;padding:7px 12px}
  .board .bt.top{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 18%,transparent);font-weight:700}
  .board .rk{min-width:2.1em;font-weight:700;color:var(--muted)}
  .board .bt.top .rk{color:inherit}
  .board .tn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board .dl{font-size:.78em;color:var(--brass);font-weight:700}
  .board .pt{min-width:2.4em;text-align:right;font-weight:700}
  .slide .sub{margin-top:6px;font-size:1rem}
  #host .nav{display:flex;justify-content:center;gap:10px;padding:0 18px 18px;flex-wrap:wrap}
  .timer{display:inline-flex;align-items:center;gap:6px}
  .ring{width:46px;height:46px;position:relative;cursor:pointer}
  .ring svg{transform:rotate(-90deg)}
  .ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
  .ring.done span{color:var(--bad)}
  #teams{width:310px;border-left:1px solid var(--line);padding:14px;overflow:auto;display:none;background:var(--panel);color:var(--ink);--line:#cdd5cd;--muted:#5b675f}
  #teams.on{display:block}
  #teams h3{margin:0 0 10px;font:700 1.15rem var(--slab)}
  .team{display:flex;align-items:center;gap:6px;margin:6px 0}
  .team .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .team .sc{width:52px;text-align:center;font-weight:700;padding:3px 2px}
  .team button{padding:3px 9px}
  .team .rin{width:64px;padding:4px 6px;text-align:center}
  #teams .meta2{color:var(--muted);font-size:.8rem;margin:-4px 0 8px}
  #teams .sizeRow{display:flex;align-items:center;gap:8px;font-size:.85rem;margin:0 0 10px}
  #teams .sizeRow input{width:60px}
  .whoright{width:min(780px,100%);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
  .whoright .lbl{width:100%;text-align:center;font-weight:700;font-size:.9rem;color:var(--muted)}
  .whoright button{background:transparent;color:var(--snug-ink);border-color:color-mix(in srgb,var(--snug-ink) 30%,transparent)}
  .whoright button[aria-pressed=true]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
  #reportModal .modalbox{width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;color:var(--ink)}
  .rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rgrid label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.85rem}
  .rgrid textarea,#rOut{font:inherit;font-size:.88rem;font-weight:400;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);color:var(--ink);resize:vertical}
  #rOut{width:100%;min-height:300px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;margin-top:12px}
  @media (max-width:640px){.rgrid{grid-template-columns:1fr}}
  #teams .hint{color:var(--muted);font-size:.78rem;margin:6px 0 0;text-align:left}
  @media (max-width:700px){#teams{position:absolute;right:0;top:0;bottom:0;z-index:3;width:min(300px,85vw);box-shadow:var(--shadow)}}

  /* Layout: sidebar + content */
  header.app .top{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
  .layout{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
  .side{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;padding-right:4px}
  .side section{margin-bottom:18px}
  .side h3{font:700 1.05rem var(--slab);color:var(--ink);margin:0 0 6px 10px}
  .sidehead{display:none}
  .navlist{display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;border-radius:9px;padding:6px 10px;font-size:.9rem;color:var(--ink)}
  .navitem:hover{background:var(--panel)}
  .navitem[aria-pressed=true]{background:var(--snug);color:var(--snug-ink)}
  .navitem .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;margin-right:8px;box-shadow:0 0 0 2px var(--panel)}

  .side .stats{margin:8px 10px 0;display:flex;flex-direction:column;gap:4px}

  #accountBtn .av::after{content:"";position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#5fd08a;border:2px solid var(--snug)}

  .wtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}

  .wbrand .mat{color:var(--snug);box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 5px var(--brass)}
  .wcards{position:relative;height:120px;margin:4px 0 14px}

  .wc.a{left:calc(50% - 76px);transform:rotate(-8deg);background:var(--panel);border:1px solid var(--line);border-top:6px solid #2f5d8a;color:#2f5d8a}
  .wc.b{left:calc(50% - 8px);transform:rotate(7deg);background:#b3541e;color:#fbf6ea}
  #welcome h2{font:700 2rem/1.1 var(--slab);margin:0 0 6px;text-align:center}
  .wsub{text-align:center;color:var(--muted);margin:0 0 14px}
  .wlist{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:6px;font-size:.92rem}
  .wlist li::before{content:"✓";color:var(--brass);font-weight:700;margin-right:8px}
  #wEmail{width:100%;margin:4px 0 10px}
  .wsent{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 6px}
  .wor{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem;margin:16px 0 10px}
  .wor::before,.wor::after{content:"";flex:1;height:1px;background:var(--line)}
  .wskip{font-weight:600}
  .wfoot{text-align:center;margin-top:12px}
  /* Print */
  #printArea{display:none}
  @media print{
    body.printing > *:not(#printArea){display:none !important}

    #printArea .team-line{margin:8pt 0 4pt;font-size:12pt}

  }
  @media (max-width:560px){.card{height:240px}h1{font-size:1rem}.tabs{margin-left:0;gap:0}.tab{padding:6px 7px;font-size:.9rem}header.app .top{gap:6px}}

<body>
<header class="app">
  <div class="wrap top">
    <h1 aria-label="Pub Quiz Cards"><span class="mat" aria-hidden="true">?</span><span class="word">Pub Quiz <b>Cards</b></span></h1>
    <nav class="tabs" aria-label="Views">
      <button class="tab" id="tabCards" data-i18n="cards"></button>
      <button class="tab" id="tabRounds" data-i18n="rounds"></button>
    </nav>
    <span class="spacer"></span>
    <button class="btn small" id="accountBtn" hidden></button>
    <button class="btn small" id="langBtn" aria-label="Language"></button>
  </div>
</header>

<main>
  <div class="wrap layout" id="cardsView">
    <aside class="side" id="side" aria-label="Filters">
      <div class="sidehead"><strong data-i18n="filters"></strong><button class="linkbtn" id="closeSide" data-i18n="done"></button></div>
      <section><h3 data-i18n="category"></h3><div class="navlist" id="cats"></div></section>
      <section><h3 data-i18n="difficulty"></h3><div class="navlist" id="lvls"></div></section>
      <section><h3 data-i18n="progress"></h3><div class="navlist" id="statusChips"></div><div class="stats" id="stats"></div></section>
    </aside>
    <div class="content">
      <div class="toolbar" id="cardControls">
        <input type="search" id="search" aria-label="Search">
        <div class="seg" role="group" aria-label="Mode">
          <button id="modeFlip" data-i18n="flip"></button><button id="modeMC" data-i18n="mc"></button>
        </div>
        <button class="btn primary" id="hostBtn" data-i18n="host"></button>
      </div>
      <div class="summary">
        <button class="btn small" id="openSide" data-i18n="filters"></button>
        <span id="count"></span>
        <button class="linkbtn" id="clearFilters" data-i18n="clear"></button>
        <span class="spacer"></span>
        <button class="btn small" id="shuffle" data-i18n="shuffle"></button>
        <button class="btn small" id="flipAll"></button>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden></div>
      <button class="btn more" id="more" hidden></button>
    </div>
  </div>
  <div class="wrap" id="roundsView" hidden>
    <div class="builder">
      <form class="panel" id="builderForm">
        <h2 data-i18n="buildTitle"></h2>
        <fieldset><legend><span class="step">1</span><span data-i18n="stepSize"></span></legend>
          <div class="pair">
            <label><span class="label" data-i18n="numRounds"></span><input type="number" id="nRounds" min="1" max="10" value="5"></label>
            <label><span class="label" data-i18n="perRound"></span><select id="perRound"><option>5</option><option>8</option><option selected>10</option><option>12</option><option>15</option><option>20</option></select></label>
          </div></fieldset>
        <fieldset><legend><span class="step">2</span><span data-i18n="difficulty"></span></legend>
          <div class="row" id="diffChips" style="margin:0"></div></fieldset>
        <fieldset><legend><span class="step">3</span><span data-i18n="roundCats"></span></legend>
          <div class="roundsel" id="roundSel"></div></fieldset>
        <fieldset><legend><span class="step">4</span><span data-i18n="options"></span></legend>
          <label class="check"><input type="checkbox" id="avoidUsed" checked> <span data-i18n="avoidUsed"></span></label>
          <div class="stats" id="usedInfo" style="margin-left:26px"></div>
          <label class="check"><input type="checkbox" id="printChoices"> <span data-i18n="printChoices"></span></label></fieldset>
        <button class="btn primary wide" type="submit" data-i18n="generate"></button>
        <div class="msg" id="buildMsg"></div>
      </form>
      <div class="panel" id="quizPanel">
        <h2 data-i18n="yourQuiz"></h2>
        <div id="quizEmpty" class="stats" data-i18n="noQuiz"></div>
        <div id="quizBody" hidden>
          <div class="quizbar">
            <button class="btn primary" id="hostQuiz" data-i18n="hostQuiz"></button>
            <span class="group"><span class="label" data-i18n="print"></span>
              <button class="btn small" id="printSheets" data-i18n="printSheets"></button>
              <button class="btn small" id="printKey" data-i18n="printKey"></button></span>
            <span class="spacer"></span>
            <button class="linkbtn" id="toggleAns"></button>
          </div>
          <div class="quiz hide-ans" id="quizList"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="host" role="dialog" aria-label="Host mode">
  <div class="bar">
    <button class="btn" id="hostClose"></button>
    <span class="pos" id="hostPos"></span>
    <span class="spacer"></span>
    <div class="hostctl"><span class="timer"><label class="label" for="timerSel" data-i18n="timer"></label>
      <select id="timerSel"><option value="0"></option><option value="15">15 s</option><option value="30">30 s</option><option value="60">60 s</option></select>
      <span class="ring" id="ring" hidden title=""><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="ringArc" cx="23" cy="23" r="20" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg><span id="ringNum"></span></span>
    </span>
    <button class="btn" id="choicesBtn" aria-pressed="false" data-i18n="showChoices"></button>
    <button class="btn" id="teamsBtn" data-i18n="teams"></button>
    <button class="btn" id="fsBtn" data-i18n="fullscreen"></button></div>
  </div>
  <div class="body" style="position:relative">
    <div class="stage" id="stage"></div>
    <aside id="teams">
      <h3 data-i18n="scoreboard"></h3>
      <p class="meta2" id="teamMeta"></p>
      <label class="sizeRow"><span data-i18n="teamSize"></span><input type="number" id="teamSize" min="0" max="30" inputmode="numeric"></label>
      <div id="teamList"></div>
      <div class="row" id="roundBtns" hidden><button class="btn small primary" id="roundSave" data-i18n="roundSave"></button><button class="btn small" id="roundCancel" data-i18n="cancel"></button></div>
      <form class="row" id="teamForm"><input type="text" id="teamName" style="flex:1;min-width:0" maxlength="400"><button class="btn small" type="submit" data-i18n="add"></button></form>
      <p class="hint" data-i18n="teamHint"></p>
      <div class="row"><button class="btn small" id="roundEntry" data-i18n="roundEntry"></button><button class="btn small" id="undoRound" data-i18n="undoRound" hidden></button></div>
      <div class="row"><button class="btn small" id="showBoard" data-i18n="showBoard"></button><button class="btn small" id="resetScores"></button></div>
      <div class="row"><button class="btn small primary" id="reportBtn" data-i18n="reportBtn"></button></div>
    </aside>
  </div>
  <div class="nav">
    <button class="btn" id="prev"></button>
    <button class="btn primary" id="reveal"></button>
    <button class="btn" id="next"></button>
  </div>
</div>

<footer class="site"><a href="privacy.html" id="privacyLink"></a> · <a href="https://github.com/brahimiarlinda/pub-quiz-cards">GitHub</a></footer>

<div id="welcome" hidden role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
  <div class="wbox">
    <div class="wtop"><span class="wbrand"><span class="mat" aria-hidden="true">?</span><span>Pub Quiz <b>Cards</b></span></span><button class="btn small" id="wLang"></button></div>
    <div class="wcards" aria-hidden="true"><div class="wc a">?</div><div class="wc b">✓</div></div>
    <h2 id="welcomeTitle" data-i18n="wTitle"></h2>
    <p class="wsub" data-i18n="wSub"></p>
    <ul class="wlist">
      <li data-i18n="wB1"></li><li data-i18n="wB2"></li><li data-i18n="wB3"></li>
    </ul>
    <div id="wForm">
      <form id="wAuthForm">
        <label class="label" for="wEmail" data-i18n="email"></label>
        <input type="email" id="wEmail" required autocomplete="email" placeholder="name@example.com">
        <button class="btn primary wide" type="submit" data-i18n="sendLink"></button>
      </form>
      <button class="btn wide" id="wGoogle" hidden data-i18n="google"></button>
    </div>
    <div id="wSent" hidden>
      <p class="wsent"><span data-i18n="linkSent"></span> <b id="wSentTo"></b></p>
      <p class="stats" data-i18n="wSentHint"></p>
      <button class="linkbtn" id="wAgain" data-i18n="wAgain"></button>
    </div>
    <p class="msg" id="wMsg" role="status"></p>
    <div class="wor"><span data-i18n="or"></span></div>
    <button class="btn wide wskip" id="wSkip" data-i18n="wSkip"></button>
    <p class="stats small wfoot"><span data-i18n="wSkipNote"></span> <a href="privacy.html" data-i18n="privacy"></a></p>
  </div>
</div>

<div id="reportModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="reportTitle">
  <div class="panel modalbox">
    <button class="linkbtn closex" id="reportClose" aria-label="Close">✕</button>
    <h2 id="reportTitle" data-i18n="reportTitle"></h2>
    <p class="stats" data-i18n="reportWhy"></p>
    <div class="rgrid">
      <label><span data-i18n="rIntro"></span><textarea id="rIntro" rows="3"></textarea></label>
      <label><span data-i18n="rSingles"></span><textarea id="rSingles" rows="3" placeholder="York – 37&#10;Aleksandr – 34"></textarea></label>
      <label><span data-i18n="rNotes"></span><textarea id="rNotes" rows="3"></textarea></label>
      <label><span data-i18n="rOutro"></span><textarea id="rOutro" rows="3"></textarea></label>
    </div>
    <textarea id="rOut" aria-label="Message" spellcheck="false"></textarea>
    <div class="row"><button class="btn primary" id="rCopy" data-i18n="rCopy"></button><button class="btn" id="rRegen" data-i18n="rRegen"></button><span class="stats" id="rMsg" role="status"></span></div>
  </div>
</div>
<div id="authModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="panel modalbox">
    <button class="linkbtn closex" id="authClose" aria-label="Close">✕</button>
    <div id="authOut">
      <h2 id="authTitle" data-i18n="signInTitle"></h2>
      <p class="stats" data-i18n="signInWhy"></p>
      <form id="authForm">
        <label class="label" for="authEmail" data-i18n="email"></label>
        <input type="email" id="authEmail" required autocomplete="email" style="width:100%;margin:4px 0 10px">
        <button class="btn primary wide" type="submit" data-i18n="sendLink"></button>
      </form>
      <button class="btn wide" id="googleBtn" hidden data-i18n="google"></button>
      <p class="stats" id="authMsg" role="status"></p>
      <p class="stats small"><span data-i18n="privacyNote"></span> <a href="privacy.html" data-i18n="privacy"></a></p>
    </div>
    <div id="authIn" hidden>
      <h2 data-i18n="account"></h2>
      <p><span data-i18n="signedInAs"></span> <b id="authWho"></b></p>
      <p class="stats" id="syncInfo"></p>
      <div class="row">
        <button class="btn" id="signOut" data-i18n="signOut"></button>
        <button class="btn" id="deleteData"></button>
      </div>
    </div>
  </div>
</div>

<div id="printArea"></div>

const diffSel=new Set(LS.get("diff",["Easy","Medium","Hard"]));
function renderBuilder(){
  $("diffChips").replaceChildren(...["Easy","Medium","Hard"].map(l=>chip(lvlName(l),diffSel.has(l),()=>{diffSel.has(l)?diffSel.delete(l):diffSel.add(l);if(!diffSel.size)diffSel.add(l);LS.set("diff",[...diffSel]);renderBuilder()})));

  $("roundSel").replaceChildren(...Array.from({length:n},(_,i)=>{const row=document.createElement("div");
    const sel=document.createElement("select"); sel.innerHTML=`<option value="random">${t("random")}</option><option value="mixed">${t("mixed")}</option>`+CATS.map(c=>`<option value="${c.slug}">${esc(catName(c))}</option>`).join("");
    sel.value=prev[i]||saved[i]||"random"; sel.onchange=()=>LS.set("roundCats",[...$("roundSel").querySelectorAll("select")].map(s=>s.value));
    row.innerHTML=`<span>${t("round")} ${i+1}</span>`; row.append(sel); return row}));
  const u=S.used.length; $("usedInfo").innerHTML=u?`${u} ${t("used")} · `:""; if(u){const b=document.createElement("button");b.type="button";b.className="linkbtn";b.textContent=t("clearUsed");b.onclick=()=>{S.used=[];LS.set("used",S.used);renderBuilder()};$("usedInfo").append(b)}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function generate(e){
  e.preventDefault(); $("buildMsg").textContent="";
  const per=+$("perRound").value; const choices=[...$("roundSel").querySelectorAll("select")].map(s=>s.value);
  const used=new Set($("avoidUsed").checked?S.used:[]); const taken=new Set();
  const pool=d=>diffSel.has(d.l)&&!used.has(d.id)&&!taken.has(d.id);
  // Pick specific categories first, then random ones from what's left
  const specific=new Set(choices.filter(c=>c!=="random"&&c!=="mixed"));
  const randomCats=shuffle(CATS.filter(c=>!specific.has(c.slug)&&c.slug!=="kids").map(c=>c.slug));
  const rounds=[];
  for(const ch of choices){
    let cat=ch; if(ch==="random"){cat=randomCats.find(s=>DATA.filter(d=>catOf(d).slug===s&&pool(d)).length>=per); if(cat) randomCats.splice(randomCats.indexOf(cat),1)}
    if(!cat){$("buildMsg").textContent=t("notEnough");return}
    let cand=DATA.filter(d=>pool(d)&&(cat==="mixed"?catOf(d).slug!=="kids":catOf(d).slug===cat));
    if(cat==="mixed"){ // spread across categories
      const by={}; shuffle(cand).forEach(d=>(by[d.c]=by[d.c]||[]).push(d)); const keys=shuffle(Object.keys(by)); cand=[];
      while(cand.length<per&&keys.some(k=>by[k].length)) for(const k of keys){if(by[k].length&&cand.length<per)cand.push(by[k].pop())}
    } else cand=shuffle(cand).slice(0,per);
    if(cand.length<per){$("buildMsg").textContent=t("notEnough");return}
    // Order within a round: easier first
    const rank={Easy:0,Medium:1,Hard:2}; cand.sort((a,b)=>rank[a.l]-rank[b.l]);
    cand.forEach(d=>taken.add(d.id));
    rounds.push({cat,ids:cand.map(d=>d.id)});
  }
  S.quiz={rounds,created:Date.now()}; LS.set("quiz",S.quiz); track("generate-quiz");
  S.used=[...new Set([...S.used,...taken])]; LS.set("used",S.used);
  renderBuilder();
}
function roundTitle(r,i){const c=CATS.find(c=>c.slug===r.cat);return `${t("round")} ${i+1} · ${c?catName(c):t("mixed")}`}
function renderQuiz(){
  const q=S.quiz; $("quizEmpty").hidden=!!q; $("quizBody").hidden=!q; if(!q) return;
  const list=$("quizList"); $("toggleAns").textContent=list.classList.contains("hide-ans")?t("showAns"):t("hideAns");

  let sb=null, user=null, timer=null, last=null, state="";
  const ready=()=>!!(sb&&user);
  function info(){const el=$("syncInfo");if(!el)return;el.textContent=state==="saving"?t("syncing"):state==="fail"?t("syncFail"):last?`${t("lastSync")}: ${last.toLocaleTimeString(S.lang==="de"?"de-DE":"en-GB",{hour:"2-digit",minute:"2-digit"})}`:""}
  function paintBtn(){const b=$("accountBtn");b.hidden=!sb;b.classList.toggle("on",!!user);if(user){b.replaceChildren();const av=document.createElement("span");av.className="av";av.textContent=(user.email||"?").slice(0,1).toUpperCase();const lb=document.createElement("span");lb.textContent=t("acctShort");b.append(av,lb)}else b.textContent=t("signIn");b.title=user?`${t("signedInAs")} ${user.email}`:t("signIn");b.setAttribute("aria-label",b.title);
    $("authOut").hidden=!!user;$("authIn").hidden=!user;if(user)$("authWho").textContent=user.email;$("googleBtn").hidden=!GOOGLE_LOGIN;info()}
  async function save(){if(!ready())return;state="saving";info();
    const {error}=await sb.from("user_data").upsert({user_id:user.id,progress:S.progress,quiz:S.quiz,teams:S.teams,used:S.used,updated_at:new Date().toISOString()});
    if(error){state="fail";info();clearTimeout(timer);timer=setTimeout(save,15000);return}
    state="";last=new Date();info()}
  function schedule(){if(!ready())return;clearTimeout(timer);timer=setTimeout(save,1500)}
  async function pull(){
    const {data,error}=await sb.from("user_data").select("*").eq("user_id",user.id).maybeSingle();
    if(error){state="fail";info();return}
    if(data){ // merge: keep everything from both; this device wins on conflicts
      S.progress={...(data.progress||{}),...S.progress};
      S.used=[...new Set([...(data.used||[]),...S.used])];
      if(data.quiz&&(!S.quiz||(data.quiz.created||0)>(S.quiz.created||0)))S.quiz=data.quiz;
      if(!S.teams.length&&Array.isArray(data.teams))S.teams=data.teams;
      for(const k of SYNC_KEYS){try{localStorage.setItem("pq-"+k,JSON.stringify(S[k]))}catch(e){}}
      renderStats();renderChips();render();if(S.view==="rounds")renderBuilder();renderTeams();
    }
    await save();
  }
  async function init(){
    if(!SUPABASE_URL||!SUPABASE_KEY)return;
    try{const mod=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      sb=mod.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{flowType:"pkce",detectSessionInUrl:true,persistSession:true}})}catch(e){return}
    paintBtn();
    sb.auth.onAuthStateChange((ev,session)=>{const was=user?.id;user=session?.user||null;paintBtn();
      if(ev==="INITIAL_SESSION")setTimeout(()=>Welcome.maybeShow(!!user),0);
      if(user){LS.set("welcomed",true);Welcome.hide()}
      if(user&&user.id!==was){track("sign-in");pull()}
      if(location.search.includes("code="))history.replaceState(null,"",location.pathname+location.hash)});
  }
  async function sendLink(email){
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
    $("authMsg").textContent=error?`${t("authError")} ${error.message}`:`${t("linkSent")} ${email}.`;return error}
  async function google(){await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}})}
  async function signOut(){await sb.auth.signOut();user=null;paintBtn();closeAuth()}
  async function wipe(){if(!ready())return;await sb.from("user_data").delete().eq("user_id",user.id);$("syncInfo").textContent=t("deleted");track("delete-data");await sb.auth.signOut();user=null;paintBtn()}
  return {init,schedule,sendLink,google,signOut,wipe,paint:paintBtn,get signedIn(){return !!user}};
})();
function openAuth(){$("authModal").hidden=false;$("authMsg").textContent="";Sync.paint();setTimeout(()=>($("authOut").hidden?$("signOut"):$("authEmail")).focus(),30)}
function closeAuth(){$("authModal").hidden=true}
$("accountBtn").onclick=openAuth; $("authClose").onclick=closeAuth;
$("authModal").onclick=e=>{if(e.target===$("authModal"))closeAuth()};
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("authModal").hidden)closeAuth();if(!$("reportModal").hidden)$("reportModal").hidden=true});
$("authForm").onsubmit=e=>{e.preventDefault();const em=$("authEmail").value.trim();if(em)Sync.sendLink(em)};
$("googleBtn").onclick=()=>Sync.google();
$("signOut").onclick=()=>Sync.signOut();
(()=>{let armed=false;const b=$("deleteData");b.onclick=()=>{if(!armed){armed=true;b.textContent=t("deleteSure");setTimeout(()=>{armed=false;b.textContent=t("deleteData")},3000);return}armed=false;b.textContent=t("deleteData");Sync.wipe()}})();
const Welcome={
  maybeShow(signedIn){ if(signedIn||LS.get("welcomed",false)||location.search.includes("code=")) return;
    $("wForm").hidden=false;$("wSent").hidden=true;$("wMsg").textContent="";$("wGoogle").hidden=!GOOGLE_LOGIN;
    $("welcome").hidden=false;document.body.style.overflow="hidden";track("welcome-shown");if(matchMedia("(pointer:fine)").matches)setTimeout(()=>$("wEmail").focus(),50)},
  hide(){if($("welcome").hidden)return;$("welcome").hidden=true;document.body.style.overflow=""}
};
$("wAuthForm").onsubmit=async e=>{e.preventDefault();const em=$("wEmail").value.trim();if(!em)return;
  const btn=e.target.querySelector("button");btn.disabled=true;const err=await Sync.sendLink(em);btn.disabled=false;
  if(err){$("wMsg").textContent=`${t("authError")} ${err.message}`;return}
  $("wMsg").textContent="";$("wSentTo").textContent=em;$("wForm").hidden=true;$("wSent").hidden=false;track("welcome-link-sent")};
$("wAgain").onclick=()=>{$("wSent").hidden=true;$("wForm").hidden=false;$("wEmail").select()};
$("wGoogle").onclick=()=>Sync.google();
$("wSkip").onclick=()=>{LS.set("welcomed",true);track("welcome-skip");Welcome.hide()};
$("wLang").onclick=()=>$("langBtn").click();
Sync.init();

applyI18n(); renderChips(); renderStats();
{const h=location.hash.slice(1);const c=CATS.find(c=>c.slug===h);if(c)S.cat=c.slug;renderChips()}
render(); fromHash();

if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
